tton></section><section class="card" aria-live="polite"><div class="result">Estimated monthly usage<strong id="out">30.00 GB</strong></div><p>Actual usage varies by video quality, app settings, downloads, updates and network conditions.</p></section><a class="back" href="/">← All PenniTools</a></main><script>const d=document.getElementById('daily'),n=document.getElementById('days'),o=document.getElementById('out');function calc(){const a=+d.value,b=+n.value;o.textContent=a>=0&&b>0?(a*b).toFixed(2)+' GB':'Enter valid values'}document.getElementById('calc').onclick=calc;d.oninput=n.oninput=calc;calc();</script></body></html>
