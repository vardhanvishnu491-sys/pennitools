<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free daily calorie needs calculator using age, sex, height, weight and activity level."><link rel="canonical" href="https://pennitools.in/calorie-calculator.html"><meta name="robots" content="index,follow"><title>Calorie Calculator – Daily Calorie Needs | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:30px;border-radius:0 0 22px 22px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input,select,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font-size:16px}input,select{border:1px solid #cfd7e4}button{margin-top:16px;border:0;background:#155eef;color:#fff;font-weight:800}.result{padding:20px;background:#f3f7ff;border-radius:12px;text-align:center}.result strong{display:block;margin-top:5px;font-size:30px;color:#155eef}.back{display:inline-block;margin-top:18px;color:#155eef;font-weight:700;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:1fr}button{min-height:46px}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Calorie Calculator</h1><div>Estimate daily calorie needs for general planning.</div></div></header><main class="wrap"><section class="card"><div class="grid"><div><label for="age">Age</label><input id="age" type="number" min="15" max="100" value="30"></div><div><label for="sex">Sex</label><select id="sex"><option value="m">Male</option><option value="f">Female</option></select></div><div><label for="height">Height (cm)</label><input id="height" type="number" min="100" max="250" value="165"></div><div><label for="weight">Weight (kg)</label><input id="weight" type="number" min="25" max="300" value="70"></div><div><label for="activity">Activity</label><select id="activity"><option value="1.2">Sedentary</option><option value="1.375">Lightly active</option><option value="1.55" selected>Moderately active</option><option value="1.725">Very active</option><option value="1.9">Extra active</option></select></div></div><button id="calc">Calculate</button></section><section class="card" aria-live="polite"><div class="result">Estimated daily calories<strong id="out">2,226 kcal/day</strong></div><p>This uses the Mifflin–St Jeor equation and is a general estimate, not medical or dietary advice.</p></section><a class="back" href="/">← All PenniTools</a></main><script>const $=id=>document.getElementById(id);function calc(){const a=+$('age').value,h=+$('height').value,w=+$('weight').value,x=+$('activity').value,s=$('sex').value;if(a>0&&h>0&&w>0){const b=s==='m'?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161;$('out').textContent=Math.round(b*x).toLocaleString('en-IN')+' kcal/day'}else $('out').textContent='Enter valid values'}$('calc').onclick=calc;document.querySelectorAll('input,select').forEach(x=>x.oninput=calc);calc();</script></body></html>
