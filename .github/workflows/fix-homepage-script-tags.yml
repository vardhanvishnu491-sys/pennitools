name: Fix homepage embedded script tags
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escape embedded script closing tags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('const docHtml=`')
          if start < 0:
              raise SystemExit('docHtml template not found')
          end=s.find('`;', start)
          if end < 0:
              raise SystemExit('docHtml template end not found')
          block=s[start:end]
          count=block.count('</script>')
          block=block.replace('</script>','<\\/script>')
          if count:
              s=s[:start]+block+s[end:]
          print('ESCAPED_EMBEDDED_SCRIPT_TAGS',count)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I)
          print('INLINE_SCRIPT_COUNT',len(blocks))
          for i,b in enumerate(blocks): Path(f'/tmp/script{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/script*.js; do node --check "$f"; done
      - name: Commit fix and remove temporary diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/homepage-js-diagnose.yml .github/workflows/browser-homepage-diagnose.yml .github/workflows/browser-homepage-stack.yml .github/workflows/fix-homepage-script-tags.yml 2>/dev/null || true
          git commit -m "Fix homepage script parsing and restore tools" || exit 0
          git push
