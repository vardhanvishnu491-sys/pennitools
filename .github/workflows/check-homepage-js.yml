name: Check homepage JavaScript
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I)
          Path('/tmp').mkdir(exist_ok=True)
          for i,b in enumerate(blocks):
              Path(f'/tmp/script{i}.js').write_text(b,encoding='utf-8')
          print('Inline scripts:',len(blocks))
          PY
          for f in /tmp/script*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Remove debug workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/check-homepage-js.yml
          git commit -m "Remove homepage JS check workflow" || true
          git push || true
