name: Restore full tool catalog once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original full catalog homepage only
        run: |
          git checkout 1752fb41b99dc7fc5a2d4e5bcf8e5d514f9c4de1 -- index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore complete embedded 100+ tool catalog" || exit 0
          git push
      - name: Remove one-time workflow
        run: |
          git rm -f .github/workflows/restore-full-index-once.yml || true
          git commit -m "Remove one-time catalog restore workflow" || true
          git push || true
