name: PenniTools calculator audit fix
on:
  push:
    paths:
      - '.github/workflows/audit-fix.yml'
permissions:
  contents: write
jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe calculator fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ("function annuity(P,annual,months){let r=annual/1200,n=months;return r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n}", "function annuity(P,annual,months){P=Number(P)||0;annual=Number(annual)||0;months=Number(months)||0;if(P<=0||months<=0)return 0;let r=annual/1200;return r?P*r*Math.pow(1+r,months)/(Math.pow(1+r,months)-1):P/months}"),
            ("case'mileage':out(`Mileage: <strong>${(num($('#distance').value)/num($('#fuel').value)).toFixed(2)} km/l</strong><br>Fuel used per 100 km: ${(num($('#fuel').value)/num($('#distance').value)*100).toFixed(2)} L`);break;", "case'mileage':{let d=num($('#distance').value),f=num($('#fuel').value);if(d<=0||f<=0)throw Error('Enter distance and fuel used as positive values.');out(`Mileage: <strong>${(d/f).toFixed(2)} km/l</strong><br>Fuel used per 100 km: ${(f/d*100).toFixed(2)} L`);break}"),
            ("case'fuel':{let d=num($('#distance').value),m=num($('#mileage').value),p=num($('#price').value),l=d/m;out(`Fuel needed: <strong>${l.toFixed(2)} L</strong><br>Trip cost: <strong>${money(l*p)}</strong>`);break}", "case'fuel':{let d=num($('#distance').value),m=num($('#mileage').value),p=num($('#price').value);if(d<=0||m<=0||p<0)throw Error('Enter positive distance and mileage, and a valid fuel price.');let l=d/m;out(`Fuel needed: <strong>${l.toFixed(2)} L</strong><br>Trip cost: <strong>${money(l*p)}</strong>`);break}"),
            ("case'trip':{let l=num($('#distance').value)/num($('#mileage').value),total=l*num($('#fuelprice').value)+num($('#toll').value),people=Math.max(1,num($('#people').value));out(`Total trip cost: <strong>${money(total)}</strong><br>Per person: <strong>${money(total/people)}</strong>`);break}", "case'trip':{let d=num($('#distance').value),m=num($('#mileage').value),fp=num($('#fuelprice').value),t=num($('#toll').value),people=Math.max(1,num($('#people').value));if(d<=0||m<=0||fp<0||t<0)throw Error('Enter positive distance and mileage, and valid fuel/toll amounts.');let l=d/m,total=l*fp+t;out(`Total trip cost: <strong>${money(total)}</strong><br>Per person: <strong>${money(total/people)}</strong>`);break}"),
            ("case'emergency':{let s=num($('#savings').value),e=num($('#expenses').value);out(`Emergency fund coverage: <strong>${(s/e).toFixed(1)} months</strong>`);break}", "case'emergency':{let s=num($('#savings').value),e=num($('#expenses').value);if(s<0||e<=0)throw Error('Enter savings and monthly expenses as valid positive values.');out(`Emergency fund coverage: <strong>${(s/e).toFixed(1)} months</strong>`);break}"),
            ("case'fuelrequired':{let d=num($('#distance').value),m=num($('#mileage').value);out(`Fuel required: <strong>${(d/m).toFixed(2)} litres</strong>`);break}", "case'fuelrequired':{let d=num($('#distance').value),m=num($('#mileage').value);if(d<=0||m<=0)throw Error('Enter positive distance and mileage.');out(`Fuel required: <strong>${(d/m).toFixed(2)} litres</strong>`);break}"),
            ("case'mileagecalc':{let d=num($('#distance').value),f=num($('#fuel').value);out(`Mileage: <strong>${(d/f).toFixed(2)} km/l</strong>`);break}", "case'mileagecalc':{let d=num($('#distance').value),f=num($('#fuel').value);if(d<=0||f<=0)throw Error('Enter positive distance and fuel used.');out(`Mileage: <strong>${(d/f).toFixed(2)} km/l</strong>`);break}"),
            ("case'cagr':{let s=num($('#startv').value),e=num($('#endv').value),y=num($('#years').value),c=(Math.pow(e/s,1/y)-1)*100;out(`CAGR: <strong>${c.toFixed(2)}%</strong>`);break}", "case'cagr':{let s=num($('#startv').value),e=num($('#endv').value),y=num($('#years').value);if(s<=0||e<=0||y<=0)throw Error('Enter positive starting value, ending value and years.');let c=(Math.pow(e/s,1/y)-1)*100;out(`CAGR: <strong>${c.toFixed(2)}%</strong>`);break}"),
            ("case'unitprice':{let a=num($('#p1').value)/num($('#q1').value),b=num($('#p2').value)/num($('#q2').value);out(`Product A: <strong>${money(a)}</strong> per unit<br>Product B: <strong>${money(b)}</strong> per unit<br>Better value: <strong>${a<b?'Product A':'Product B'}</strong>`);break}", "case'unitprice':{let p1=num($('#p1').value),q1=num($('#q1').value),p2=num($('#p2').value),q2=num($('#q2').value);if(p1<0||p2<0||q1<=0||q2<=0)throw Error('Enter valid positive quantities and prices.');let a=p1/q1,b=p2/q2;out(`Product A: <strong>${money(a)}</strong> per unit<br>Product B: <strong>${money(b)}</strong> per unit<br>Better value: <strong>${a<b?'Product A':'Product B'}</strong>`);break}"),
          ]
          changed=0
          for a,b in replacements:
              if a in s:
                  s=s.replace(a,b); changed+=1
          if changed < 8:
              raise SystemExit(f'Expected safety fixes were not all found; only {changed} replacements matched. No commit made.')
          p.write_text(s,encoding='utf-8')
          print(f'Applied {changed} calculator safety fixes.')
          PY
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Audit and harden calculator inputs' || true
          git rm .github/workflows/audit-fix.yml
          git commit -m 'Remove temporary audit workflow'
          git push