name: Move Featured Calculators to Top
on:
  push:
    branches: [main]
jobs:
  move-featured:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move Featured Calculators section
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = re.compile(r'<section\b[^>]*>.*?<h2[^>]*>\s*Featured calculators\s*</h2>.*?</section>', re.I | re.S)
          m = marker.search(s)
          if not m:
              raise SystemExit('Featured calculators section not found')
          block = m.group(0)
          # Remove only the existing Featured Calculators section.
          s2 = s[:m.start()] + s[m.end():]
          # Put it at the top of the main app content, preserving its existing markup/styles.
          anchor = re.search(r'<div\s+id=[\"\']app[\"\']\s*>', s2, re.I)
          if not anchor:
              raise SystemExit('Main app container not found')
          insert_at = anchor.end()
          s2 = s2[:insert_at] + '\n' + block + s2[insert_at:]
          p.write_text(s2, encoding='utf-8')
      - name: Commit homepage change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Move featured calculators to top of homepage'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/move-featured-calculators-top.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/move-featured-calculators-top.yml
          git commit -m 'Remove temporary featured calculators workflow'
          git push
