name: Fix hardening formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair injected script newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- PENNITOOLS-FINAL-HARDENING -->'
          i=s.find(marker)
          if i<0:
              raise SystemExit('marker not found')
          head=s[:i]
          block=s[i:]
          block=block.replace('\\\\n','\n')
          p.write_text(head+block,encoding='utf-8')
          PY
      - name: Remove workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-hardening-format.yml
          git add index.html
          git commit -m "Fix calculator hardening script formatting" || exit 0
          git push
