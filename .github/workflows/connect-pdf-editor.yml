name: Connect PDF Editor

on:
  push:
    paths:
      - '.github/workflows/connect-pdf-editor.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect homepage PDF Editor to standalone editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function openTool(id,title){ $('#modal').classList.add('show'); $('#toolBody').innerHTML=`<h2>${title}</h2>${toolHTML(id)}`; bindTool(id); }"
          new = "function openTool(id,title){ if(id==='pdfeditor'){ window.location.href='/pdf-editor.html'; return; } $('#modal').classList.add('show'); $('#toolBody').innerHTML=`<h2>${title}</h2>${toolHTML(id)}`; bindTool(id); }"
          if old not in s:
              raise SystemExit('Expected openTool function was not found; no changes made.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage connection
        run: |
          git config user.name 'PenniTools Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Connect homepage PDF Editor to standalone editor'
          git push
