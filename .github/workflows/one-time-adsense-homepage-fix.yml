name: One-time AdSense homepage fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update homepage safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          adsense = '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2877520218090125" crossorigin="anonymous"></script>'
          if 'ca-pub-2877520218090125' not in s:
              s = s.replace('</head>', adsense + '</head>', 1)

          # Convert the existing branded homepage heading into a semantic H1.
          # The homepage already styles .brand as the primary visual title.
          if '<h1 class="brand">' not in s and '<div class="brand">' in s:
              s = s.replace('<div class="brand">', '<h1 class="brand">', 1)
              s = re.sub(r'(<h1 class="brand">.*?</h1>|<h1 class="brand">.*?</div>)', lambda m: m.group(0).replace('</div>', '</h1>'), s, count=1, flags=re.S)

          if s == original:
              print('No homepage changes were necessary.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Homepage updated with AdSense loader and semantic H1.')
          PY

      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add AdSense loader and homepage H1"
            git push
          fi
