name: PenniTools audit fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix calculator duplicates and validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="['Everyday','Percentage Calculator','Calculate percentages quickly.','percentage']"
          new="['Everyday','Percentage Calculator','Calculate percentages quickly.','percentagecalc']"
          if old in s:
              s=s.replace(old,new,1)
          marker="case'percentage':out(`<strong>${(num($('#value').value)/num($('#total').value)*100).toFixed(2)}%</strong>`);break;"
          insert="case'percentagecalc':{let v=num($('#value').value),t=num($('#total').value);if(t===0)throw Error('Total cannot be zero.');out(`<strong>${(v/t*100).toFixed(2)}%</strong>`);break;}\n"
          if "case'percentagecalc':" not in s and marker in s:
              s=s.replace(marker,insert+marker,1)
          # Make the Percentage of Total tool explicitly reject zero totals.
          old2="case'pcttotal':{let a=num($('#part').value),b=num($('#total').value);out(`<strong>${b?((a/b)*100).toFixed(2):0}%</strong>`);break}"
          new2="case'pcttotal':{let a=num($('#part').value),b=num($('#total').value);if(b===0)throw Error('Total cannot be zero.');out(`<strong>${(a/b*100).toFixed(2)}%</strong>`);break}"
          if old2 in s:
              s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "PenniTools Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix percentage calculator validation" || true
          rm -f .github/workflows/penni-audit-fix.yml
          git add -A
          git commit -m "Remove temporary audit workflow" || true
          git push