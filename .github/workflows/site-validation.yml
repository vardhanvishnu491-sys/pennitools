name: Validate PenniTools

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required site files
        run: |
          test -f index.html
          test -f 404.html
          test -f CNAME
          test -f robots.txt
          test -f sitemap.xml
          test -f about.html
          test -f disclaimer.html
          test -f privacy-policy.html
          test -f terms.html
          test -f tools-index.html
          test -f pdf-editor.html
          test -f image-tools.html
          test -f background-remover.html
          test -f document-image-tools.html
          test -f pdf-tools.html
          test -f finance-extra.html
          test -f text-tools.html
          test -f work-everyday-tools.html
          test -f carpenter-calculators.html
          test -f carpenter-tool.html
          test -f construction-calculators.html
          test -f construction-extra.html
          test -f square-feet-calculator.html
          test -f tiles-calculator.html
          test -f emi-calculator.html
          test -f gst-calculator.html
          test -f percentage-calculator.html
          test -f discount-calculator.html
          test -f mileage-calculator.html
          test -f fuel-cost-calculator.html
          test -f ev-range-calculator.html
          test -f ev-charging-cost-calculator.html
          test -f mobile-calculator.html
          test -f calorie-calculator.html
          test -f audio-transcriber.html
          test -f scientific-calculator.html
          test -f audio-duration-calculator.html

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              blocks = re.findall(r'<script(?![^>]*type=["\']application/ld\+json["\'])(?:\s[^>]*)?>([\s\S]*?)</script>', text, flags=re.I)
              for i, block in enumerate(blocks):
                  Path(f'/tmp/{path.stem}-{i}.js').write_text(block, encoding='utf-8')
          PY
          shopt -s nullglob
          files=(/tmp/*.js)
          test ${#files[@]} -gt 0
          for file in "${files[@]}"; do node --check "$file"; done

      - name: Check homepage tool initialization markers
        run: |
          grep -q "const cats=" index.html
          grep -q "const tools=" index.html
          grep -q "toolSelect" index.html
          grep -q "function render" index.html

      - name: Check sitemap coverage for key standalone tools
        run: |
          for path in tools-index finance-extra text-tools work-everyday-tools pdf-editor image-tools background-remover document-image-tools pdf-tools carpenter-calculators carpenter-tool construction-calculators construction-extra gst-calculator percentage-calculator discount-calculator mileage-calculator fuel-cost-calculator ev-range-calculator ev-charging-cost-calculator mobile-calculator calorie-calculator audio-transcriber scientific-calculator audio-duration-calculator; do
            grep -q "https://pennitools.in/$path.html" sitemap.xml
          done

      - name: Check robots and policy pages
        run: |
          grep -q "https://pennitools.in/sitemap.xml" robots.txt
          grep -q "https://pennitools.in/" sitemap.xml
          grep -q "Privacy Policy" privacy-policy.html
          grep -q "Terms of Use" terms.html
          grep -q "Disclaimer" disclaimer.html
