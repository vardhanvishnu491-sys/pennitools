name: Validate PenniTools

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply final PenniTools theme layer to every HTML page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -s theme.css
          test -s theme-final.css
          for file in *.html; do
            [ -f "$file" ] || continue
            python3 - "$file" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          s=s.replace('favicon.png', 'favicon.svg')
          if '</head>' not in s:
              raise SystemExit(f'Missing </head>: {p}')
          s=s.replace('<link rel="stylesheet" href="/theme.css?v=20260914"><link rel="stylesheet" href="/theme-final.css?v=20260914"></head>', '<link rel="stylesheet" href="/theme.css?v=20260914b"><link rel="stylesheet" href="/theme-final.css?v=20260914b"></head>', 1)
          s=s.replace('<link rel="stylesheet" href="/theme.css?v=20260914"></head>', '<link rel="stylesheet" href="/theme.css?v=20260914b"><link rel="stylesheet" href="/theme-final.css?v=20260914b"></head>', 1)
          if '/theme.css?v=20260914b' not in s:
              s=s.replace('</head>', '<link rel="stylesheet" href="/theme.css?v=20260914b"><link rel="stylesheet" href="/theme-final.css?v=20260914b"></head>', 1)
          elif '/theme-final.css?v=20260914b' not in s:
              s=s.replace('</head>', '<link rel="stylesheet" href="/theme-final.css?v=20260914b"></head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          done

      - name: Enforce homepage section order
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); html=p.read_text(encoding='utf-8')
          def extract(pattern,label):
              m=re.search(pattern,html,re.S)
              if not m: raise SystemExit(f'{label} not found')
              return m.group(1)
          hero=extract(r'(<section class="trust-hero"[\s\S]*?</section>)','Main Introduction')
          featured=extract(r'(<section class="section featured-home"[\s\S]*?</section>)','Featured Calculators')
          popular=extract(r'(<section class="popular-section"[\s\S]*?</section>)','Popular Tools')
          selector=extract(r'(<div class="selector-wrap">[\s\S]*?</div>)\s*(?=<main\b[^>]*\bid="app")','Calculator Categories')
          app=extract(r'(<main\b[^>]*\bid="app"[^>]*>[\s\S]*?</main>)','All Tools')
          for block in (hero,featured,popular,selector,app): html=html.replace(block,'',1)
          pos=html.find('</header>')
          if pos<0: raise SystemExit('Header not found')
          ordered='\n'+hero+'\n'+featured+'\n'+popular+'\n'+selector+'\n'+app+'\n'
          pos+=len('</header>'); html=html[:pos]+ordered+html[pos:]
          p.write_text(html,encoding='utf-8')
          PY

      - name: Add durable SEO structured data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,html
          
          def inject(path, payload):
              p=Path(path); s=p.read_text(encoding='utf-8')
              marker=f'"@id":"https://pennitools.in/{payload.get("@type", "schema")}"'
              if marker in s: return
              block='<script type="application/ld+json">'+json.dumps(payload,separators=(",",":"),ensure_ascii=False)+'</script>\n'
              if '</head>' not in s: raise SystemExit(f'Missing head: {p}')
              s=s.replace('</head>',block+'</head>',1)
              p.write_text(s,encoding='utf-8')
          
          home=Path('index.html')
          hs=home.read_text(encoding='utf-8')
          if '"@type":"Organization"' not in hs or '"@type":"WebSite"' not in hs:
              payload={"@context":"https://schema.org","@graph":[
                {"@type":"Organization","@id":"https://pennitools.in/organization","name":"PenniTools","url":"https://pennitools.in/","logo":"https://pennitools.in/favicon.svg","description":"Free calculators and practical browser-based tools for everyday use in India."},
                {"@type":"WebSite","@id":"https://pennitools.in/website","url":"https://pennitools.in/","name":"PenniTools","description":"Free calculators and practical tools for construction, carpentry, finance, vehicles, documents and everyday calculations in India.","publisher":{"@id":"https://pennitools.in/organization"}}
              ]}
              block='<script type="application/ld+json">'+json.dumps(payload,separators=(",",":"),ensure_ascii=False)+'</script>\n'
              hs=hs.replace('</head>',block+'</head>',1)
              home.write_text(hs,encoding='utf-8')
          
          tools=Path('tools-index.html')
          if tools.exists():
              ts=tools.read_text(encoding='utf-8')
              if '"@type":"ItemList"' not in ts:
                  items=[]
                  for i,(name,url) in enumerate([
                    ('Trip Cost Calculator','trip-cost-calculator.html'),('Fuel Cost Calculator','fuel-cost-calculator.html'),('Mileage Calculator','mileage-calculator.html'),('Square Feet Calculator','square-feet-calculator.html'),('Tiles Calculator','tiles-calculator.html'),('Paint Calculator','paint-calculator.html'),('Concrete Calculator','concrete-calculator.html'),('EMI Calculator','emi-calculator.html'),('GST Calculator','gst-calculator.html'),('PDF Tools','pdf-tools.html'),('Image Tools','image-tools.html')],1):
                      items.append({"@type":"ListItem","position":i,"name":name,"url":"https://pennitools.in/"+url})
                  payload={"@context":"https://schema.org","@type":"ItemList","name":"Popular PenniTools Calculators and Tools","url":"https://pennitools.in/tools-index.html","itemListElement":items}
                  block='<script type="application/ld+json">'+json.dumps(payload,separators=(",",":"),ensure_ascii=False)+'</script>\n'
                  ts=ts.replace('</head>',block+'</head>',1)
                  tools.write_text(ts,encoding='utf-8')
          print('Structured data enhancement complete.')
          PY

      - name: Commit automated theme, homepage and SEO changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' index.html theme.css theme-final.css
          git diff --cached --quiet || git commit -m "Apply PenniTools theme and SEO enhancements"
          git push || true

      - name: Verify final theme coverage
        shell: bash
        run: |
          test -s theme.css
          test -s theme-final.css
          for file in *.html; do
            [ -f "$file" ] || continue
            grep -q 'theme-final.css?v=20260914b' "$file" || { echo "Final theme missing: $file"; exit 1; }
          done
          echo "Final theme is linked from every HTML page."

      - name: Verify homepage order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          markers=[
            ('Header',html.find('</header>')),
            ('Main Introduction',html.find('class="trust-hero"')),
            ('Featured Calculators',html.find('class="section featured-home"')),
            ('Popular Tools',html.find('class="popular-section"')),
            ('Calculator Categories',html.find('class="selector-wrap"')),
            ('All Tools',html.find('<main class="wrap" id="app">')),
            ('Footer',html.find('<footer'))]
          if any(p<0 for _,p in markers) or [p for _,p in markers]!=sorted(p for _,p in markers):
              raise SystemExit(f'Homepage order invalid: {markers}')
          print(' -> '.join(n for n,_ in markers))
          PY

      - name: Validate required site files and AdSense
        run: |
          test -f index.html
          test -f 404.html
          test -f CNAME
          test -f robots.txt
          test -f sitemap.xml
          test -f ads.txt
          grep -Fxq "google.com, pub-2877520218090125, DIRECT, f08c47fec0942fa0" ads.txt

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?![^>]*type=["\']application/ld\+json["\'])(?:\s[^>]*)?>([\s\S]*?)</script>',text,re.I)
              for i,b in enumerate(blocks): Path(f'/tmp/{path.stem}-{i}.js').write_text(b,encoding='utf-8')
          PY
          for file in /tmp/*.js; do node --check "$file"; done

      - name: Validate internal links and sitemap targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          import re, sys
          ROOT = Path('.').resolve()
          HTML = {p.name for p in ROOT.glob('*.html')}
          errors = []
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  for key in ('href','src','poster'):
                      value=a.get(key)
                      if value: self.refs.append((key,value))
          for page in sorted(ROOT.glob('*.html')):
              parser=Links(); parser.feed(page.read_text(encoding='utf-8'))
              for attr, ref in parser.refs:
                  if ref.startswith(('#','mailto:','tel:','javascript:','data:')): continue
                  u=urlparse(ref)
                  if u.scheme or u.netloc:
                      if u.scheme in ('http','https') and u.netloc.lower() in ('pennitools.in','www.pennitools.in'):
                          target=unquote(u.path or '/')
                      else: continue
                  else:
                      target=unquote(u.path)
                  if not target: continue
                  if target.startswith('/'):
                      candidate=(ROOT / target.lstrip('/')).resolve()
                  else:
                      candidate=(page.parent / target).resolve()
                  if ROOT not in candidate.parents and candidate != ROOT:
                      errors.append(f'{page}: unsafe local path {ref}'); continue
                  if candidate.is_dir(): candidate=candidate/'index.html'
                  if not candidate.exists(): errors.append(f'{page}: broken {attr} {ref}')
          sitemap=ROOT/'sitemap.xml'
          if sitemap.exists():
              xml=sitemap.read_text(encoding='utf-8')
              for url in re.findall(r'<loc>(.*?)</loc>',xml):
                  u=urlparse(url)
                  if u.netloc.lower() not in ('pennitools.in','www.pennitools.in'): continue
                  target=unquote(u.path or '/')
                  candidate=(ROOT / target.lstrip('/')).resolve()
                  if candidate.is_dir(): candidate=candidate/'index.html'
                  if not candidate.exists(): errors.append(f'sitemap: missing target {url}')
          if errors:
              print('Internal-link/sitemap errors:')
              print('\\n'.join(errors))
              sys.exit(1)
          print(f'Internal links and sitemap targets passed for {len(list(ROOT.glob("*.html")))} HTML pages.')
          PY

      - name: Run core-tool regression checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          errors=[]
          home=Path('index.html').read_text(encoding='utf-8')
          if 'function escapeTranscriptHtml' not in home:
              errors.append('Audio AI transcript analysis must escape user-controlled transcript text before inserting HTML')
          if home.count('escapeTranscriptHtml(s)') < 3:
              errors.append('Audio AI analysis must escape transcript text in key points, action items and questions')
          if 'function transcribeFile(pipe,file,lang,status,label)' not in home:
              errors.append('Audio AI must revoke temporary audio URLs after processing')
          if 'Xenova/whisper-small" selected' not in home:
              errors.append('Audio AI default model should remain the balanced option for device compatibility')
          tiles=Path('tiles-calculator.html').read_text(encoding='utf-8')
          if not re.search(r'id="w"[^>]*max="50"',tiles) or 'wInput>50' not in tiles:
              errors.append('Tile calculator must enforce its 0–50% wastage limit in the UI and JavaScript')
          paint=Path('paint-calculator.html').read_text(encoding='utf-8')
          if 'Number.isFinite' not in paint or 'Number.isInteger(w)' not in paint:
              errors.append('Paint calculator must validate finite measurements and whole-number wall counts')
          gst=Path('gst-calculator.html').read_text(encoding='utf-8')
          if 'Number.isFinite' not in gst or 'too large to calculate safely' not in gst:
              errors.append('GST calculator must guard against extreme values')
          trip=Path('trip-cost-calculator.html').read_text(encoding='utf-8')
          if 'Number.isInteger(rawPeople)' not in trip or 'Number.isFinite' not in trip:
              errors.append('Trip calculator must validate traveller count and finite results')
          if '[[400000,0],[400000,.05],[400000,.10],[400000,.15],[400000,.20],[400000,.25],[Infinity,.30]]' not in home:
              errors.append('Income tax calculator must include the current 25% slab band')
          if 'Math.min(tax,60000)' not in home or 'maxTax=(x-1200000)/(1+cessRate/100)' not in home:
              errors.append('Income tax calculator must apply the eligible rebate and marginal-relief estimate')
          if 'p>1e15||r<0||r>100' not in home or "p/(1+r/100)" not in home:
              errors.append('Homepage GST calculator must reject invalid rates and prevent division by zero')
          if 'annual/1200' not in home or ':m*n' not in home:
              errors.append('Recurring-deposit calculator must handle zero interest and use a monthly-rate approximation')
          if 'r?a*((Math.pow(1+r,n)-1)/r):a*n' not in home:
              errors.append('PPF calculator must handle a zero-interest scenario')
          emi=Path('emi-calculator.html').read_text(encoding='utf-8')
          headings=re.findall(r'<h3>(.*?)</h3>',emi,re.I)
          if sum(1 for h in headings if h.strip().lower()=='emi formula')>1:
              errors.append('EMI guide must not repeat the same formula heading')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('Core-tool regression checks passed.')
          PY

      - name: Validate metadata and internal page links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          errors=[]
          for p in Path('.').glob('*.html'):
              t=p.read_text(encoding='utf-8')
              if '<meta name="viewport"' not in t.lower(): errors.append(f'{p}: viewport')
              if not re.search(r'<title>\s*[^<]+\s*</title>',t,re.I): errors.append(f'{p}: title')
              if p.name!='404.html' and not re.search(r'<meta[^>]+name=["\']description["\']',t,re.I): errors.append(f'{p}: description')
          if errors: print('\n'.join(errors)); sys.exit(1)
          print('Metadata checks passed.')
          PY
