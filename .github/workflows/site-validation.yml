name: Validate PenniTools

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate required site files
        run: |
          test -f index.html
          test -f 404.html
          test -f CNAME
          test -f robots.txt
          test -f sitemap.xml
          test -f ads.txt
          test -f about.html
          test -f contact.html
          test -f disclaimer.html
          test -f privacy-policy.html
          test -f terms.html
          test -f tools-index.html
          test -f pdf-editor.html
          test -f image-tools.html
          test -f background-remover.html
          test -f document-image-tools.html
          test -f pdf-tools.html
          test -f finance-extra.html
          test -f text-tools.html
          test -f work-everyday-tools.html
          test -f carpenter-calculators.html
          test -f carpenter-tool.html
          test -f construction-calculators.html
          test -f construction-extra.html
          test -f square-feet-calculator.html
          test -f tiles-calculator.html
          test -f emi-calculator.html
          test -f gst-calculator.html
          test -f percentage-calculator.html
          test -f discount-calculator.html
          test -f mileage-calculator.html
          test -f fuel-cost-calculator.html
          test -f ev-range-calculator.html
          test -f ev-charging-cost-calculator.html
          test -f mobile-calculator.html
          test -f calorie-calculator.html
          test -f audio-transcriber.html
          test -f scientific-calculator.html
          test -f audio-duration-calculator.html
          test -f fuel-efficiency-converter.html
          test -f tire-size-calculator.html
          test -f vehicle-calculators.html

      - name: Validate AdSense ads.txt
        run: |
          test "$(wc -l < ads.txt)" -eq 1
          grep -Fxq "google.com, pub-2877520218090125, DIRECT, f08c47fec0942fa0" ads.txt

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              blocks = re.findall(r'<script(?![^>]*type=["\']application/ld\+json["\'])(?:\s[^>]*)?>([\s\S]*?)</script>', text, flags=re.I)
              for i, block in enumerate(blocks):
                  Path(f'/tmp/{path.stem}-{i}.js').write_text(block, encoding='utf-8')
          PY
          shopt -s nullglob
          files=(/tmp/*.js)
          test ${#files[@]} -gt 0
          for file in "${files[@]}"; do node --check "$file"; done

      - name: Check homepage tool initialization markers
        run: |
          grep -q "const cats=" index.html
          grep -q "const tools=" index.html
          grep -q "toolSelect" index.html
          grep -q "function render" index.html

      - name: Validate basic HTML metadata and accessibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          errors=[]
          for path in sorted(Path('.').glob('*.html')):
              text=path.read_text(encoding='utf-8')
              if '<meta name="viewport"' not in text.lower():
                  errors.append(f'{path}: missing viewport meta')
              if not re.search(r'<title>\s*[^<]+\s*</title>', text, re.I):
                  errors.append(f'{path}: missing title')
              if path.name != '404.html' and not re.search(r'<meta[^>]+name=["\']description["\'][^>]+content=["\'][^"\']+["\']', text, re.I):
                  errors.append(f'{path}: missing meta description')
              has_h1 = re.search(r'<h1\b[^>]*>[^<]*\S[^<]*</h1>', text, re.I)
              homepage_brand = path.name == 'index.html' and re.search(r'<[^>]+class=["\'][^"\']*\bbrand\b[^"\']*["\'][^>]*>', text, re.I)
              if not has_h1 and not homepage_brand:
                  errors.append(f'{path}: missing H1')
              for m in re.finditer(r'<img\b([^>]*)>', text, re.I):
                  attrs=m.group(1)
                  if not re.search(r'\balt\s*=\s*["\']', attrs, re.I):
                      errors.append(f'{path}: image missing alt attribute')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Basic metadata and image accessibility checks passed.')
          PY

      - name: Validate internal HTML links and anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import html, re, sys

          root = Path('.')
          pages = {p.name for p in root.glob('*.html')}
          errors = []
          href_re = re.compile(r'\bhref\s*=\s*["\']([^"\']+)["\']', re.I)
          id_re = re.compile(r'\bid\s*=\s*["\']([^"\']+)["\']', re.I)

          def static_html(text):
              return re.sub(r'<(?:script|style)\b[^>]*>[\s\S]*?</(?:script|style)>', '', text, flags=re.I)

          for path in sorted(root.glob('*.html')):
              text = path.read_text(encoding='utf-8')
              static_text = static_html(text)
              ids = [html.unescape(x) for x in id_re.findall(static_text)]
              seen = set()
              for ident in ids:
                  if ident in seen:
                      errors.append(f'{path}: duplicate id="{ident}"')
                  seen.add(ident)
              for href in href_re.findall(static_text):
                  href = html.unescape(href).strip()
                  if not href or href.startswith(('#','mailto:','tel:','javascript:','data:')):
                      continue
                  parsed = urlsplit(href)
                  if parsed.scheme or parsed.netloc:
                      continue
                  target = parsed.path.lstrip('/') or 'index.html'
                  if target not in pages:
                      errors.append(f'{path}: missing internal page target {href}')
                      continue
                  if parsed.fragment:
                      target_text = static_html((root / target).read_text(encoding='utf-8'))
                      target_ids = set(id_re.findall(target_text))
                      if parsed.fragment not in target_ids:
                          errors.append(f'{path}: missing anchor {href}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Static internal HTML links, anchors and IDs look valid.')
          PY

      - name: Check sitemap coverage for all standalone HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          missing=[]
          for p in Path('.').glob('*.html'):
              if p.name == '404.html':
                  continue
              url='https://pennitools.in/'+p.name
              if url not in sitemap:
                  missing.append(url)
          if missing:
              print('Missing sitemap URLs:')
              print('\n'.join(missing))
              sys.exit(1)
          print('All standalone HTML pages are represented in sitemap.xml.')
          PY

      - name: Check robots and policy pages
        run: |
          grep -q "https://pennitools.in/sitemap.xml" robots.txt
          grep -q "https://pennitools.in/" sitemap.xml
          grep -q "Privacy Policy" privacy-policy.html
          grep -q "Terms of Use" terms.html
          grep -q "Disclaimer" disclaimer.html
          grep -q "Contact PenniTools" contact.html
