name: Fix PenniTools trustbar placement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix PenniTools trustbar placement') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct homepage trustbar placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          trust='<div class="site-trustbar" aria-label="PenniTools information links"><strong>Free & practical tools</strong><span class="dot">•</span><a href="/about.html">About</a><span class="dot">•</span><a href="/privacy-policy.html">Privacy</a><span class="dot">•</span><a href="/terms.html">Terms</a><span class="dot">•</span><a href="/disclaimer.html">Disclaimer</a></div>'
          s=s.replace('\n'+trust+'\n</body></html>`;','\n</body></html>`;',1)
          if trust not in s.rsplit('</body>',1)[-1]:
              before, close=s.rsplit('</body>',1)
              before=before.rstrip()+"\n"+trust+"\n"
              s=before+'</body>'+close
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          rm -f .github/workflows/fix-site-trustbar-placement.yml
          git add -u .github/workflows/fix-site-trustbar-placement.yml
          git commit -m "Fix PenniTools trustbar placement"
          git push
