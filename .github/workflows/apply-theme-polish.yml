name: Apply PenniTools Theme Polish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add theme polish to every HTML page
        shell: bash
        run: |
          set -euo pipefail
          for file in *.html; do
            [ -f "$file" ] || continue
            if ! grep -q 'href="/theme-polish.css"' "$file"; then
              python3 - "$file" <<'PY'
import sys
from pathlib import Path
p=Path(sys.argv[1])
s=p.read_text(encoding='utf-8')
needle='</head>'
link='<link rel="stylesheet" href="/theme-polish.css">'
if needle not in s:
    raise SystemExit(f'Missing </head> in {p}')
p.write_text(s.replace(needle,link+needle,1),encoding='utf-8')
PY
            fi
          done
      - name: Verify theme polish
        shell: bash
        run: |
          set -euo pipefail
          for file in *.html; do
            [ -f "$file" ] || continue
            grep -q 'href="/theme-polish.css"' "$file" || { echo "Theme polish missing: $file"; exit 1; }
          done
          test -s theme-polish.css
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' theme-polish.css .github/workflows/apply-theme-polish.yml
          git rm -f .github/workflows/apply-theme-polish.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish homepage and calculator card colors"
          git push
