name: Safe PenniTools routing patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe routing guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- PENNITOOLS_SAFE_ROUTING_V1 -->'
          if marker not in s:
              patch = '''\n<script>\n/* PENNITOOLS_SAFE_ROUTING_V1 */\n(function(){\n  var originalOpenTool = window.openTool;\n  if (typeof originalOpenTool !== 'function') return;\n  window.openTool = function(key, title){\n    if (key === 'pdfeditor' || key === 'pdf-editor') {\n      window.location.href = 'pdf-editor.html';\n      return;\n    }\n    if (key === 'tripcost') key = 'trip';\n    return originalOpenTool.call(this, key, title);\n  };\n})();\n</script>\n'''
              if '</body>' not in s:
                  raise SystemExit('index.html does not contain </body>; refusing to modify')
              s = s.replace('</body>', patch + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Harden homepage tool routing' || true
          git rm .github/workflows/safe-tool-routing.yml || true
          git commit -m 'Remove temporary routing patch workflow' || true
          git push
