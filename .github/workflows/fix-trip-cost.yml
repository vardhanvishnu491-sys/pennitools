name: Fix Trip Cost Calculator

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-trip-cost:
    if: contains(github.event.head_commit.message, 'Temporary fix Trip Cost')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Trip Cost calculator reference
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "openTool('tripcost','Trip Cost Calculator')"
          new = "openTool('trip','Trip Cost Calculator')"
          if old not in s:
              raise SystemExit('Expected Trip Cost reference was not found.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-trip-cost.yml
          git commit -m "Fix Trip Cost Calculator"
          git push
