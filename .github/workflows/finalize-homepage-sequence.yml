name: Finalize Homepage Sequence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sequence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Arrange homepage sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          def take(pattern, text):
              m = re.search(pattern, text, re.S)
              return m.group(0) if m else None

          # Preserve the existing content; only reorder the named homepage blocks.
          featured = take(r'<section class="section featured-home"[\\s\\S]*?</section>', html)
          hero = take(r'<section class="trust-hero"[\\s\\S]*?</section>', html)
          popular = take(r'<section class="popular-section"[\\s\\S]*?</section>', html)
          selector = take(r'<div class="selector-wrap"[\\s\\S]*?</div>\\s*(?=<)', html)
          app = take(r'<main id="app"[\\s\\S]*?</main>', html)

          if not (hero and featured and popular and app):
              raise SystemExit('Required homepage sections were not found; no changes made.')

          # Remove the blocks we are explicitly arranging.
          blocks = [hero, featured, popular]
          if selector:
              blocks.append(selector)
          blocks.append(app)
          for block in blocks:
              html = html.replace(block, '', 1)

          # Insert in the exact requested visual/source order after the header.
          header_end = html.find('</header>')
          if header_end < 0:
              raise SystemExit('Homepage header not found; no changes made.')
          insert_at = header_end + len('</header>')

          ordered = '\n' + hero + '\n' + featured + '\n' + popular
          if selector:
              ordered += '\n' + selector
          ordered += '\n' + app + '\n'
          html = html[:insert_at] + ordered + html[insert_at:]

          p.write_text(html, encoding='utf-8')
          PY

      - name: Verify order and remove one-time workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          markers = {
              'Main Introduction': html.find('class="trust-hero"'),
              'Featured Calculators': html.find('class="section featured-home"'),
              'Popular Tools': html.find('class="popular-section"'),
              'Calculator Categories': html.find('class="selector-wrap"'),
              'All Tools': html.find('<main id="app"'),
              'Footer': html.find('<footer')
          }
          if any(v < 0 for v in markers.values()):
              raise SystemExit(f'Missing homepage marker: {markers}')
          vals = list(markers.values())
          if vals != sorted(vals):
              raise SystemExit(f'Homepage order is incorrect: {markers}')
          print('Homepage order verified:', ' -> '.join(markers))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Arrange homepage sections in requested order" || true
          git push
          git rm .github/workflows/finalize-homepage-sequence.yml
          git commit -m "Remove one-time homepage sequence workflow"
          git push
