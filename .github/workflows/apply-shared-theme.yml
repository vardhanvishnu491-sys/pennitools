name: Apply Shared PenniTools Theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Add shared theme to every HTML page
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          for file in *.html; do
            [ -f "$file" ] || continue
            if ! grep -q 'href="/theme.css"' "$file"; then
              python3 - "$file" <<'PY'
import sys
from pathlib import Path
p=Path(sys.argv[1])
s=p.read_text(encoding='utf-8')
needle='</head>'
link='<link rel="stylesheet" href="/theme.css">'
if needle not in s:
    raise SystemExit(f'Missing </head> in {p}')
s=s.replace(needle, link+needle, 1)
p.write_text(s, encoding='utf-8')
PY
              changed=1
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Verify all HTML pages load the shared theme
        shell: bash
        run: |
          set -euo pipefail
          for file in *.html; do
            [ -f "$file" ] || continue
            grep -q 'href="/theme.css"' "$file" || { echo "Theme missing: $file"; exit 1; }
          done
          test -s theme.css

      - name: Commit theme links and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' theme.css .github/workflows/apply-shared-theme.yml
          git rm -f .github/workflows/apply-shared-theme.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply shared dark theme across all pages"
          git push
