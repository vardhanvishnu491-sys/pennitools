name: Reorder Homepage Sections

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/reorder-homepage-sections.yml

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move featured calculators below the tool selector
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          featured_re = re.compile(
              r'<section class="section" aria-labelledby="featured-calculators">.*?</section>',
              re.S,
          )
          selector_re = re.compile(
              r'<div class="selector-wrap">.*?</select>\s*</div>',
              re.S,
          )

          featured = featured_re.search(text)
          selector = selector_re.search(text)

          if not featured or not selector:
              raise SystemExit("Featured calculators section or selector was not found")

          if featured.start() > selector.end():
              print("Featured calculators is already below the selector")
          else:
              featured_block = featured.group(0)
              text_without_featured = text[:featured.start()] + text[featured.end():]
              selector_after = selector_re.search(text_without_featured)
              if not selector_after:
                  raise SystemExit("Selector could not be located after removing featured section")

              insertion = selector_after.end()
              text = text_without_featured[:insertion] + "\n" + featured_block + text_without_featured[insertion:]
              path.write_text(text, encoding="utf-8")
              print("Moved Featured calculators below Open a calculator selector")

      - name: Commit homepage layout change and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage layout change needed"
          else
            git commit -m "Clarify homepage section order"
            git push
          fi
          git rm .github/workflows/reorder-homepage-sections.yml
          git commit -m "Remove one-time homepage reorder workflow"
          git push
