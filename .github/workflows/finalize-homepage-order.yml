name: Finalize Homepage Order

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/finalize-homepage-order.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Put Featured calculators directly below the header
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          featured_re = re.compile(
              r'<section class="section" aria-labelledby="featured-calculators">.*?</section>',
              re.S,
          )
          trust_re = re.compile(r'<section class="trust-hero">', re.S)
          header_end = text.find('</header>')
          featured = featured_re.search(text)
          trust = trust_re.search(text)

          if header_end < 0 or not featured or not trust:
              raise SystemExit("Required homepage sections were not found")

          featured_block = featured.group(0)
          text = text[:featured.start()] + text[featured.end():]
          trust = re.search(r'<section class="trust-hero">', text)
          if not trust:
              raise SystemExit("Trust section could not be located after removing featured section")

          insertion = trust.start()
          text = text[:insertion] + featured_block + "\n" + text[insertion:]
          path.write_text(text, encoding="utf-8")
          print("Featured calculators placed directly below the header")

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage order change needed"
          else
            git commit -m "Place featured calculators at top of homepage"
            git push
          fi
          git rm .github/workflows/finalize-homepage-order.yml
          git commit -m "Remove one-time homepage order workflow"
          git push
