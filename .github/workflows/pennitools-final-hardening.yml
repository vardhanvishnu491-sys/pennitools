name: PenniTools final hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden calculator UX and validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- PENNITOOLS-FINAL-HARDENING -->'
          if marker in s:
              raise SystemExit(0)
          script = r'''\n<!-- PENNITOOLS-FINAL-HARDENING -->\n<script>\n(function(){\n  'use strict';\n  const isBadNumber = v => v === '' || !Number.isFinite(Number(v));\n  const clean = v => Number.isFinite(Number(v)) ? Number(v) : null;\n\n  // Prevent accidental NaN/Infinity results across calculators without changing formulas.\n  document.addEventListener('click', function(e){\n    const btn = e.target.closest('button, input[type="button"], input[type="submit"]');\n    if(!btn) return;\n    const text = (btn.textContent || btn.value || '').trim().toLowerCase();\n    if(!/(calculate|calculat|compute|convert|find|estimate|check|generate|solve)/.test(text)) return;\n    const scope = btn.closest('.panel, .modal, .tool, .card, form') || document;\n    const fields = Array.from(scope.querySelectorAll('input[type="number"]:not([disabled])'));\n    const invalid = fields.find(function(input){\n      const value = input.value.trim();\n      if(value === '') return !input.readOnly;\n      return !Number.isFinite(Number(value));\n    });\n    if(invalid){\n      invalid.focus();\n      invalid.setCustomValidity('Please enter a valid number.');\n      invalid.reportValidity();\n      e.preventDefault();\n      e.stopImmediatePropagation();\n      return;\n    }\n    fields.forEach(function(input){ input.setCustomValidity(''); });\n    setTimeout(function(){\n      const outputs = scope.querySelectorAll('#out, .result, .result-box, .output, [class*="result"]');\n      outputs.forEach(function(out){\n        const t = (out.textContent || '').toLowerCase();\n        if(t.includes('nan') || t.includes('infinity') || t.includes('undefined')){\n          out.textContent = 'Please check the inputs and enter valid values.';\n          out.setAttribute('role','alert');\n        }\n      });\n    }, 0);\n  }, true);\n\n  // Enter key calculates when a calculator has a clear Calculate button.\n  document.addEventListener('keydown', function(e){\n    if(e.key !== 'Enter' || e.target.tagName === 'TEXTAREA') return;\n    const scope = e.target.closest('.panel, .modal, .tool, .card, form');\n    if(!scope) return;\n    const btn = Array.from(scope.querySelectorAll('button, input[type="button"], input[type="submit"]'))\n      .find(function(b){ return /(calculate|calculat|compute|convert|find|estimate|check|generate|solve)/i.test((b.textContent || b.value || '')); });\n    if(btn){ e.preventDefault(); btn.click(); }\n  });\n\n  // Escape closes open modals; clicking the backdrop also closes them.\n  document.addEventListener('keydown', function(e){\n    if(e.key !== 'Escape') return;\n    document.querySelectorAll('.modal.show').forEach(function(m){\n      const close = m.querySelector('.close');\n      if(close) close.click(); else m.classList.remove('show');\n    });\n  });\n  document.addEventListener('click', function(e){\n    if(e.target.classList && e.target.classList.contains('modal')){\n      const close = e.target.querySelector('.close');\n      if(close) close.click();\n      else e.target.classList.remove('show');\n    }\n  });\n\n  // Improve number fields on mobile keyboards.\n  document.querySelectorAll('input[type="number"]').forEach(function(input){\n    input.setAttribute('inputmode','decimal');\n    input.addEventListener('input', function(){ input.setCustomValidity(''); });\n  });\n\n  // Avoid stale calculator output after a user changes an input.\n  document.addEventListener('input', function(e){\n    if(!e.target.matches('input, select')) return;\n    const scope = e.target.closest('.panel, .modal, .tool, .card, form');\n    if(!scope) return;\n    scope.querySelectorAll('#out, .result, .result-box, .output').forEach(function(out){\n      out.dataset.stale = '1';\n    });\n  });\n})();\n</script>\n'''
          if '</body>' in s:
              s = s.replace('</body>', script + '</body>', 1)
          else:
              s += script
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pennitools-final-hardening.yml
          git add index.html
          git commit -m "Harden calculators and improve calculator UX" || exit 0
          git push
