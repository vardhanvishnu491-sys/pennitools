name: Ensure AdSense sitewide

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensure-adsense:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add AdSense connection code to HTML pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script = '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2877520218090125" crossorigin="anonymous"></script>'
          meta = '<meta name="google-adsense-account" content="ca-pub-2877520218090125">'
          changed = []

          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              if 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2877520218090125' not in text and '</head>' in text.lower():
                  idx = text.lower().rfind('</head>')
                  text = text[:idx] + script + '\n' + text[idx:]
              if 'name="google-adsense-account"' not in text and '</head>' in text.lower():
                  idx = text.lower().rfind('</head>')
                  text = text[:idx] + meta + '\n' + text[idx:]
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ensure-adsense-sitewide.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Ensure AdSense connection across site"
          git push
