<!doctype html>

<head>

<title>PenniTools — Everyday Calculators & Tools</title>
<style>
:root{
  --ink:#0b1220;
  --muted:#667085;
  --blue:#2563eb;
  --blue2:#1d4ed8;
  --cyan:#06b6d4;
  --bg:#f5f7fb;
  --card:#ffffff;
  --line:#e7ebf2;
  --shadow:0 12px 35px rgba(15,23,42,.08);
  --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  background:var(--bg);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.55;
}
body:before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:-1;
  background:
    radial-gradient(circle at 8% 8%,rgba(37,99,235,.08),transparent 25%),
    radial-gradient(circle at 92% 18%,rgba(6,182,212,.07),transparent 22%);
}
header{
  position:relative;
  overflow:hidden;
  color:#fff;
  padding:58px 22px 76px;
  background:
    radial-gradient(circle at 85% 15%,rgba(255,255,255,.16),transparent 25%),
    radial-gradient(circle at 10% 80%,rgba(6,182,212,.18),transparent 30%),
    linear-gradient(135deg,#0b1f4d 0%,#123a8f 48%,#2563eb 100%);
  box-shadow:0 10px 30px rgba(15,23,42,.15);
}
header:after{
  content:"";
  position:absolute; left:-5%; right:-5%; bottom:-70px; height:130px;
  background:var(--bg);
  border-radius:50% 50% 0 0/55% 55% 0 0;
}
header .nav, header > div, header > h1, header > p, header input{
  position:relative; z-index:2;
}
header h1{
  margin:0 auto 8px; max-width:1120px;
  font-size:clamp(42px,8vw,76px);
  line-height:1;
  letter-spacing:-3px;
  font-weight:850;
}
header h1::first-letter{color:#8ec5ff}
header p{
  max-width:1120px; margin:0 auto 28px;
  color:rgba(255,255,255,.86);
  font-size:clamp(17px,2.5vw,22px);
}
header input{
  display:block; width:min(760px,100%); margin:0 auto;
  padding:18px 22px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:16px;
  background:rgba(255,255,255,.98);
  color:var(--ink);
  font-size:18px;
  outline:none;
  box-shadow:0 14px 35px rgba(0,0,0,.14);
}
header input:focus{box-shadow:0 0 0 4px rgba(96,165,250,.28),0 14px 35px rgba(0,0,0,.14)}
#tools{
  width:min(1120px,calc(100% - 32px));
  margin:-8px auto 70px;
  position:relative; z-index:3;
}
.section{
  margin:46px 0 18px;
  padding:0;
}
.section h2{
  margin:0 0 6px;
  font-size:clamp(25px,4vw,34px);
  letter-spacing:-1px;
}
.section > p{
  margin:0 0 18px;
  color:var(--muted);
}
.tool{
  display:inline-flex;
  vertical-align:top;
  flex-direction:column;
  width:calc(33.333% - 14px);
  min-height:220px;
  margin:0 14px 14px 0;
  padding:24px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 5px 18px rgba(15,23,42,.045);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.tool:hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow);
  border-color:#cbd8f7;
}
.tool h3{
  margin:0 0 8px;
  font-size:21px;
  letter-spacing:-.3px;
}
.tool p{
  margin:0 0 18px;
  color:var(--muted);
  flex:1;
}
.tool button,.tool a{
  display:inline-flex; align-items:center; justify-content:center;
  width:max-content; min-width:120px;
  padding:11px 17px;
  border:0; border-radius:12px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;
  font-weight:750;
  text-decoration:none;
  cursor:pointer;
  box-shadow:0 7px 15px rgba(37,99,235,.2);
}
.tool button:hover,.tool a:hover{filter:brightness(1.06);transform:translateY(-1px)}
.tool .badge{
  display:inline-flex; width:max-content;
  margin-bottom:14px; padding:5px 10px;
  border-radius:999px;
  background:#eef4ff; color:var(--blue2);
  font-size:12px; font-weight:800;
}
footer{
  padding:42px 20px;
  background:#0b1220;
  color:#cbd5e1;
  text-align:center;
}
footer strong{color:#fff}
@media(max-width:900px){
  .tool{width:calc(50% - 10px);margin-right:10px}
}
@media(max-width:620px){
  header{padding:42px 18px 68px}
  header h1{letter-spacing:-2px}
  #tools{width:calc(100% - 24px);margin-bottom:45px}
  .section{margin-top:34px}
  .tool{display:flex;width:100%;margin:0 0 13px;min-height:190px;padding:21px}
  .tool h3{font-size:20px}
}
</style>

function render(){
 const q=($('#search').value||'').toLowerCase(), active=window.cat||'All';
 const groups={}; tools.filter(t=>(active==='All'||t[0]===active)&&t.slice(1,3).join(' ').toLowerCase().includes(q)).forEach(t=>(groups[t[0]]??=[]).push(t));
 $('#app').innerHTML=Object.entries(groups).map(([g,arr])=>`<section class="section"><h2>${g}</h2><p>Useful ${g.toLowerCase()} tools.</p><div class="grid">${arr.map(t=>`<article class="card"><h3>${t[1]}</h3><p>${t[2]}</p><button class="btn" onclick="openTool('${t[3]}','${t[1].replaceAll("'","")}')">Use tool</button></article>`).join('')}</div></section>`).join('')||'<div class="empty">No tools found.</div>';
}
$('#cats').innerHTML=cats.map(c=>`<button class="chip" onclick="window.cat='${c}';render()">${c}</button>`).join('');
$('#search').addEventListener('input',render); render();

function openTool(id,title){ $('#modal').classList.add('show'); $('#toolBody').innerHTML=`<h2>${title}</h2>${toolHTML(id)}`; bindTool(id); }
function closeTool(){ $('#modal').classList.remove('show'); $('#toolBody').innerHTML=''; }
function f(fields,button='Calculate'){return `<div class="row">${fields}</div><button class="btn" id="calc">${button}</button><div id="out"></div>`}
function inp(id,label,val='',type='number',step='any'){return `<div><label>${label}</label><input id="${id}" type="${type}" value="${val}" ${type==='number'?`step="${step}"`:''}></div>`}

case'inflation':return f(inp('p','Current amount',100000)+inp('r','Inflation %',6)+inp('t','Years',10));

 const cat=$('#uc').value, maps={Length:['m','km','cm','ft','in'],Weight:['kg','g','lb','oz'],Temperature:['C','F','K']}, a=maps[cat]; $('#uf').innerHTML=a.map(x=>`<option>${x}</option>`).join(''); $('#ut').innerHTML=a.map(x=>`<option>${x}</option>`).join('');

function hcf(a,b){a=Math.abs(Math.trunc(a));b=Math.abs(Math.trunc(b));while(b){let t=a%b;a=b;b=t}return a||1}
function indianWords(n){
 n=Math.trunc(n); if(n===0)return 'Zero';
 const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
 const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 function two(x){return x<20?ones[x]:tens[Math.floor(x/10)]+(x%10?' '+ones[x%10]:'')}
 function part(x){let s='';if(x>=100){s+=ones[Math.floor(x/100)]+' Hundred';x%=100;if(x)s+=' '}if(x)s+=two(x);return s}
 let out=''; const groups=[[1e9,'Crore'],[1e5,'Lakh'],[1e3,'Thousand'],[1e2,'Hundred']];
 for(const [v,name] of groups){if(n>=v){let q=Math.floor(n/v);out+=(out?' ':'')+part(q)+' '+name;n%=v}}
 if(n)out+=(out?' ':'')+part(n); return out;
}
function annuity(P,annual,months){let r=annual/1200,n=months;return r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n}
function parsePages(s,max){let out=[];(s||'').split(',').forEach(x=>{x=x.trim();if(x.includes('-')){let [a,b]=x.split('-').map(Number);for(let i=a;i<=b;i++)out.push(i)}else{let n=Number(x);if(n)out.push(n)}});return [...new Set(out)].filter(n=>n>=1&&(!max||n<=max))}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

 case'tax':{let x=Math.max(0,num($('#income').value)-num($('#ded').value)), slabs=[[400000,0],[400000,.05],[400000,.10],[400000,.15],[400000,.20],[Infinity,.30]],tax=0,prev=0;for(const [cap,rate] of slabs){let part=Math.max(0,Math.min(x,prev+cap)-prev);tax+=part*rate;prev+=cap;if(x<=prev)break}let cess=tax*num($('#cess').value)/100;out(`Estimated tax before cess: <strong>${money(tax)}</strong><br>Cess: ${money(cess)}<br>Total estimate: <strong>${money(tax+cess)}</strong><br><span class="small">Simplified slab estimate; verify current exemptions, rebate, surcharge and final rules.</span>`);break}
 case'hike':case'increment':{let s=num($('#salary').value),p=num($('#pct').value);out(`Revised salary: <strong>${money(s*(1+p/100))}/year</strong><br>Increase: ${money(s*p/100)}<br>Monthly revised: ${money(s*(1+p/100)/12)}`);break}
 case'elig':{let inc=num($('#income').value),emi=Math.max(0,inc*num($('#ratio').value)/100-num($('#existing').value)),P=annuity(1,num($('#rate').value),num($('#tenure').value));out(`Estimated additional EMI capacity: <strong>${money(emi)}</strong><br>Estimated loan amount: <strong>${money(emi/P)}</strong>`);break}
 case'sip':{let m=num($('#sip').value),r=num($('#rate').value)/1200,n=num($('#years').value)*12,fv=r?m*((Math.pow(1+r,n)-1)/r)*(1+r):m*n;out(`Maturity: <strong>${money(fv)}</strong><br>Invested: ${money(m*n)}<br>Estimated gains: ${money(fv-m*n)}`);break}
 case'fd':{let p=num($('#principal').value),r=num($('#rate').value)/100,f=num($('#freq').value),y=num($('#years').value),fv=p*Math.pow(1+r/f,f*y);out(`Maturity: <strong>${money(fv)}</strong><br>Interest: ${money(fv-p)}`);break}

 case'ppf':{let a=num($('#annual').value),r=num($('#rate').value)/100,n=num($('#years').value),fv=a*((Math.pow(1+r,n)-1)/r);out(`Estimated maturity: <strong>${money(fv)}</strong><br>Total contributions: ${money(a*n)}`);break}

 case'simpleint':{let p=num($('#p').value),r=num($('#r').value),t=num($('#t').value),i=p*r*t/100;out(`Simple interest: <strong>${money(i)}</strong><br>Maturity amount: <strong>${money(p+i)}</strong>`);break}

async function pdfToJpg(){
 let f=$('#pdf').files[0]; if(!f)throw Error('Choose a PDF');
 const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');
 pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
 const pdf=await pdfjs.getDocument({data:await f.arrayBuffer()}).promise;
 for(let i=1;i<=pdf.numPages;i++){
   const page=await pdf.getPage(i),v=page.getViewport({scale:1.6});
   const c=document.createElement('canvas'); c.width=v.width;c.height=v.height;
   await page.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
   c.toBlob(b=>dl(b,`pennitools-page-${i}.jpg`),'image/jpeg',.92);
 }
 out(`${pdf.numPages} JPG page(s) created.`);
}
async function pageNumberPdf(){
 let d=await pdfDoc(),pages=d.getPages();
 pages.forEach((p,i)=>{let s=p.getSize();p.drawText(String(i+1),{x:s.width/2-5,y:15,size:10})});
 dl(new Blob([await d.save()],{type:'application/pdf'}),'pennitools-numbered.pdf');out('Page numbers added.');
}
async function rotatePdf(){
 let d=await pdfDoc(),a=Number($('#angle').value);
 d.getPages().forEach(p=>p.setRotation(PDFLib.degrees((p.getRotation().angle+a)%360)));
 dl(new Blob([await d.save()],{type:'application/pdf'}),'pennitools-rotated.pdf');out(`Pages rotated by ${a}°.`);
}
async function imageDownload(mode){
let f=$('#img').files[0];if(!f)throw Error('Choose an image');let src=await fileData(f),im=new Image();await new Promise(r=>{im.onload=r;im.src=src});let c=document.createElement('canvas'),ctx=c.getContext('2d');
if(mode==='resize'){c.width=num($('#w').value)||im.width;c.height=num($('#h').value)||im.height;ctx.drawImage(im,0,0,c.width,c.height)}else if(mode==='passport'){c.width=num($('#pw').value)||413;c.height=num($('#ph').value)||531;ctx.drawImage(im,0,0,c.width,c.height)}else if(mode==='crop'){let x=Math.max(0,num($('#x').value)),y=Math.max(0,num($('#y').value)),w=Math.min(num($('#cw').value)||im.width,im.width-x),h=Math.min(num($('#ch').value)||im.height,im.height-y);c.width=w;c.height=h;ctx.drawImage(im,x,y,w,h,0,0,w,h)}else{c.width=im.width;c.height=im.height;ctx.drawImage(im,0,0,c.width,c.height)}let type=mode==='convert'?$('#fmt').value:'image/jpeg',q=mode==='compress'?num($('#quality').value):mode==='resize'?num($('#quality').value):.9;c.toBlob(b=>dl(b,mode==='convert'&&type==='image/png'?'pennitools.png':'pennitools.jpg'),type,q);out('Image downloaded.')}
</script>
</body></html>
