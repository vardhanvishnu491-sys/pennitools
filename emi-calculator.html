<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free EMI calculator for home, car and personal loans. Calculate monthly EMI, total interest and total repayment in seconds."><meta name="robots" content="index,follow"><link rel="canonical" href="https://pennitools.in/emi-calculator.html"><title>EMI Calculator – Loan EMI, Interest & Total Payment | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:28px;border-radius:0 0 24px 24px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cfd7e4;border-radius:10px;font-size:16px}.btn{margin-top:16px;border:0;border-radius:11px;padding:13px 18px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.result{padding:18px;border-radius:14px;background:#f3f7ff}.result strong{display:block;font-size:24px;color:#155eef}.small{color:#667085;font-size:13px}@media(max-width:650px){.grid,.results{grid-template-columns:1fr}.wrap{padding:12px}.hero{padding:22px}}</style></head><body><div class="hero"><div class="wrap"><strong>PenniTools</strong><h1>EMI Calculator</h1><div>Calculate monthly EMI, total interest and total repayment instantly.</div></div></div><main class="wrap"><section class="card"><div class="grid"><div class="field"><label for="amount">Loan amount (₹)</label><input id="amount" type="number" min="1" step="1000" value="500000"></div><div class="field"><label for="rate">Annual interest (%)</label><input id="rate" type="number" min="0" step="0.01" value="10"></div><div class="field"><label for="years">Loan term (years)</label><input id="years" type="number" min="1" max="50" step="1" value="5"></div></div><button class="btn" id="calc">Calculate EMI</button></section><section class="card" aria-live="polite"><div class="results"><div class="result"><span>Monthly EMI</span><strong id="emi">₹0</strong></div><div class="result"><span>Total interest</span><strong id="interest">₹0</strong></div><div class="result"><span>Total payment</span><strong id="total">₹0</strong></div></div><p class="small">This calculator provides an estimate. Actual lender schedules can vary with fees, dates and rounding.</p></section></main><script>const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);function calc(){const P=+$('amount').value,r=+$('rate').value/1200,n=Math.round((+$('years').value)*12);if(!(P>0)||!(n>0)||r<0)return;if(r===0){$('emi').textContent=money(P/n);$('total').textContent=money(P);$('interest').textContent=money(0);return}const emi=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1),total=emi*n;$('emi').textContent=money(emi);$('total').textContent=money(total);$('interest').textContent=money(total-P)}$('calc').addEventListener('click',calc);document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc();</script></body></html>
