<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free text counter and reading time calculator from PenniTools."><title>Text Counter & Reading Time | PenniTools</title><style>:root{--b:#2563eb;--ink:#101828;--muted:#667085;--bg:#f6f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,sans-serif}.wrap{width:min(900px,calc(100% - 24px));margin:auto}.hero{margin:22px 0;padding:28px;background:linear-gradient(135deg,#071633,#2563eb);color:#fff;border-radius:22px}.card{background:#fff;border:1px solid #e1e7f0;border-radius:16px;padding:20px}.field{display:flex;flex-direction:column;gap:6px}.field textarea{min-height:280px;padding:12px;border:1px solid #ccd5e3;border-radius:10px;font:16px/1.5 Arial;resize:vertical}.btn{margin-top:12px;border:0;border-radius:9px;padding:11px 16px;background:var(--b);color:#fff;font-weight:800;cursor:pointer}.out{margin-top:14px;padding:14px;background:#eef4ff;border:1px solid #d8e5ff;border-radius:10px}.note{color:var(--muted);font-size:14px}</style></head><body><main class="wrap"><section class="hero"><h1>📝 Text Counter & Reading Time</h1><p>Count words, characters and estimate how long text takes to read.</p></section><section class="card"><div class="field"><label for="text">Paste or type your text</label><textarea id="text" placeholder="Enter text here…"></textarea></div><button class="btn" onclick="countText()">Analyze Text</button><div id="out" class="out">Start typing, then analyze.</div><p class="note">Reading time uses an approximate 200 words per minute. Results are estimates.</p></section><p><a href="/tools-index.html">← All 100+ Tools</a></p></main><script>function countText(){const t=document.getElementById('text').value,words=t.trim()?t.trim().split(/\s+/).length:0,chars=t.length,no=t.replace(/\s/g,'').length,mins=words/200;document.getElementById('out').innerHTML=`Words: <b>${words}</b><br>Characters: <b>${chars}</b><br>Characters without spaces: <b>${no}</b><br>Estimated reading time: <b>${mins<1?Math.max(1,Math.ceil(mins*60))+' seconds':Math.ceil(mins)+' minutes'}</b>`}document.getElementById('text').addEventListener('input',countText);</script></body></html>
