<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free mileage calculator for cars and bikes in India. Calculate km per litre and fuel efficiency."><link rel="canonical" href="https://pennitools.in/mileage-calculator.html"><meta name="robots" content="index,follow"><title>Mileage Calculator India – Calculate KM/L | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:30px;border-radius:0 0 22px 22px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font-size:16px}input{border:1px solid #cfd7e4}button{margin-top:16px;border:0;background:#155eef;color:#fff;font-weight:800}.result{padding:20px;background:#f3f7ff;border-radius:12px;text-align:center}.result strong{display:block;margin-top:5px;font-size:30px;color:#155eef}.back{display:inline-block;margin-top:18px;color:#155eef;font-weight:700;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:1fr}button{min-height:46px}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Mileage Calculator</h1><div>Calculate your vehicle's fuel efficiency in km/l.</div></div></header><main class="wrap"><section class="card"><div class="grid"><div><label for="distance">Distance travelled (km)</label><input id="distance" type="number" min="0" step="0.1" value="300"></div><div><label for="fuel">Fuel used (litres)</label><input id="fuel" type="number" min="0" step="0.1" value="20"></div></div><button id="calc">Calculate Mileage</button></section><section class="card" aria-live="polite"><div class="result">Fuel efficiency<strong id="out">15.00 km/l</strong></div></section><a class="back" href="/vehicle-calculators.html">← Vehicle Calculators</a></main><script>const d=document.getElementById('distance'),f=document.getElementById('fuel'),o=document.getElementById('out');function calc(){const a=+d.value,b=+f.value;o.textContent=a>0&&b>0?(a/b).toFixed(2)+' km/l':'Enter valid values'}document.getElementById('calc').onclick=calc;d.oninput=f.oninput=calc;</script></body></html>
