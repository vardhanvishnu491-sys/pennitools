<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free mileage calculator for cars and bikes in India. Calculate km per litre and fuel efficiency."><link rel="canonical" href="https://pennitools.in/mileage-calculator.html"><meta name="robots" content="index,follow"><title>Mileage Calculator India – Calculate KM/L | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:30px;border-radius:0 0 22px 22px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font-size:16px}input{border:1px solid #cfd7e4}input:focus-visible,button:focus-visible,.back:focus-visible{outline:3px solid #98b9ff;outline-offset:2px}button{margin-top:16px;border:0;background:#155eef;color:#fff;font-weight:800}.result{padding:20px;background:#f3f7ff;border-radius:12px;text-align:center}.result strong{display:block;margin-top:5px;font-size:30px;color:#155eef}.error{color:#b42318;font-weight:700;min-height:22px;margin-top:10px}.back{display:inline-block;margin-top:18px;color:#155eef;font-weight:700;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:1fr}button{min-height:46px}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Mileage Calculator</h1><div>Calculate your vehicle's fuel efficiency in km/l.</div></div></header><main class="wrap"><section class="card"><div class="grid"><div><label for="distance">Distance travelled (km)</label><input id="distance" type="number" min="0" max="10000000" step="0.1" value="300" inputmode="decimal"></div><div><label for="fuel">Fuel used (litres)</label><input id="fuel" type="number" min="0" max="1000000" step="0.1" value="20" inputmode="decimal"></div></div><button id="calc" type="button">Calculate Mileage</button><div class="error" id="error" aria-live="polite"></div></section><section class="card" aria-live="polite"><div class="result">Fuel efficiency<strong id="out">15.00 km/l</strong></div></section><a class="back" href="/vehicle-calculators.html">← Vehicle Calculators</a></main><script>const d=document.getElementById('distance'),f=document.getElementById('fuel'),o=document.getElementById('out'),error=document.getElementById('error');function calc(){const a=Number(d.value),b=Number(f.value);error.textContent='';if(!Number.isFinite(a)||!Number.isFinite(b)||a<=0||b<=0||a>10000000||b>1000000){o.textContent='—';error.textContent='Please enter a valid positive distance and fuel amount.';return}const result=a/b;if(!Number.isFinite(result)){o.textContent='—';error.textContent='The entered values are too large to calculate safely.';return}o.textContent=result.toFixed(2)+' km/l'}document.getElementById('calc').onclick=calc;d.oninput=f.oninput=calc;calc();</script></body></html>
