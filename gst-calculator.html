<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free GST calculator for India. Calculate GST amount, inclusive price and original price quickly."><link rel="canonical" href="https://pennitools.in/gst-calculator.html"><meta name="robots" content="index,follow"><title>GST Calculator India – Add or Remove GST | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:30px;border-radius:0 0 22px 22px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input,select,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font-size:16px}input,select{border:1px solid #cfd7e4}button{margin-top:16px;border:0;background:#155eef;color:#fff;font-weight:800;cursor:pointer}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.result{padding:15px;background:#f3f7ff;border-radius:12px}.result strong{display:block;margin-top:4px;font-size:21px;color:#155eef}.back{display:inline-block;margin-top:18px;color:#155eef;font-weight:700;text-decoration:none}.error{color:#b42318;font-weight:700;min-height:20px;margin-top:8px}input:focus,select:focus,button:focus,.back:focus{outline:3px solid #98aaf8;outline-offset:2px}@media(max-width:600px){.grid,.results{grid-template-columns:1fr}.wrap{padding:12px}button{min-height:46px}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>GST Calculator</h1><div>Quickly add GST or remove GST from an inclusive price.</div></div></header><main class="wrap"><section class="card"><div class="grid"><div><label for="amount">Amount (₹)</label><input id="amount" type="number" min="0" step="0.01" value="1000"></div><div><label for="rate">GST rate</label><select id="rate"><option value="0">0%</option><option value="5">5%</option><option value="12">12%</option><option value="18" selected>18%</option><option value="28">28%</option></select></div></div><label for="mode" style="margin-top:16px">Calculation</label><select id="mode"><option value="add">Add GST to base amount</option><option value="remove">Remove GST from inclusive amount</option></select><div class="error" id="error" aria-live="polite"></div><button type="button" id="calc">Calculate GST</button></section><section class="card" aria-live="polite"><div class="results"><div class="result">Base amount<strong id="base">₹0</strong></div><div class="result">GST amount<strong id="gst">₹0</strong></div><div class="result">Final amount<strong id="total">₹0</strong></div></div></section><a class="back" href="/finance-calculators.html">← Finance Calculators</a></main><script>const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(n);function calc(){const a=Number($('amount').value),r=Number($('rate').value)/100;$('error').textContent='';if(!Number.isFinite(a)||a<0||!Number.isFinite(r)||r<0){['base','gst','total'].forEach(id=>$(id).textContent='—');$('error').textContent='Please enter a valid non-negative amount.';return}if($('mode').value==='add'){const g=a*r,total=a+g;$('base').textContent=money(a);$('gst').textContent=money(g);$('total').textContent=money(total)}else{const b=a/(1+r),g=a-b;$('base').textContent=money(b);$('gst').textContent=money(g);$('total').textContent=money(a)}}$('calc').addEventListener('click',calc);document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',calc));calc();</script></body></html>
