<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free fuel efficiency converter between km/L, L/100 km and MPG."><link rel="canonical" href="https://pennitools.in/fuel-efficiency-converter.html"><meta name="robots" content="index,follow"><title>Fuel Efficiency Converter – km/L, L/100 km, MPG | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:30px;border-radius:0 0 22px 22px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input,select,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font-size:16px}input,select{border:1px solid #cfd7e4}input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}button{margin-top:16px;border:0;background:#155eef;color:#fff;font-weight:800;cursor:pointer}.results{display:grid;gap:10px}.result{padding:16px;background:#f3f7ff;border-radius:12px}.result strong{display:block;margin-top:4px;font-size:24px;color:#155eef}.back{display:inline-block;margin-top:18px;color:#155eef;font-weight:700;text-decoration:none}.back:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}@media(max-width:600px){.grid{grid-template-columns:1fr}button{min-height:46px}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Fuel Efficiency Converter</h1><div>Convert fuel economy between km/L, L/100 km and MPG.</div></div></header><main class="wrap"><section class="card"><div class="grid"><div><label for="value">Fuel efficiency</label><input id="value" type="number" min="0" max="100000" step="any" value="15" required aria-describedby="value-help"><div id="value-help">Enter a value greater than 0.</div></div><div><label for="unit">Input unit</label><select id="unit"><option value="kml">km/L</option><option value="l100">L/100 km</option><option value="mpg_us">MPG (US)</option><option value="mpg_imp">MPG (UK)</option></select></div></div><button id="calc" type="button">Convert</button></section><section class="card" aria-live="polite"><div class="results"><div class="result">Kilometres per litre<strong id="kml">15.00 km/L</strong></div><div class="result">Litres per 100 km<strong id="l100">6.67 L/100 km</strong></div><div class="result">Miles per gallon (US)<strong id="mpgus">35.25 MPG</strong></div><div class="result">Miles per gallon (UK)<strong id="mpgimp">42.34 MPG</strong></div></div></section><a class="back" href="/vehicle-calculators.html">← Vehicle Calculators</a></main><script>const v=document.getElementById('value'),u=document.getElementById('unit');const k=document.getElementById('kml'),l=document.getElementById('l100'),us=document.getElementById('mpgus'),imp=document.getElementById('mpgimp');function calc(){let x=Number(v.value),kml;if(!(Number.isFinite(x)&&x>0&&x<=100000)){[k,l,us,imp].forEach(e=>e.textContent='Enter a valid value');return}if(u.value==='kml')kml=x;else if(u.value==='l100')kml=100/x;else if(u.value==='mpg_us')kml=x*0.4251437075;else kml=x*0.3540061899;if(!(Number.isFinite(kml)&&kml>0)){[k,l,us,imp].forEach(e=>e.textContent='Enter a valid value');return}k.textContent=kml.toFixed(2)+' km/L';l.textContent=(100/kml).toFixed(2)+' L/100 km';us.textContent=(kml*2.352145833).toFixed(2)+' MPG';imp.textContent=(kml*2.824809363).toFixed(2)+' MPG'}document.getElementById('calc').onclick=calc;v.oninput=calc;u.onchange=calc;calc();</script></body></html>
