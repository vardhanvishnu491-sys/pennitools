<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free concrete volume calculator. Estimate concrete required for a slab, footing or rectangular section and include optional wastage."><link rel="canonical" href="https://pennitools.in/concrete-calculator.html"><meta name="robots" content="index,follow"><title>Concrete Calculator – Volume & Quantity | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:800px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:30px;border-radius:0 0 22px 22px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font-size:16px}input{border:1px solid #cfd7e4}button{margin-top:16px;border:0;background:#155eef;color:#fff;font-weight:800}.result{padding:20px;background:#f3f7ff;border-radius:12px;text-align:center}.result strong{display:block;margin-top:5px;font-size:30px;color:#155eef}.back{display:inline-block;margin-top:18px;color:#155eef;font-weight:700;text-decoration:none}.note{color:#667085;font-size:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}button{min-height:46px}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Concrete Calculator</h1><div>Estimate concrete volume for rectangular work.</div></div></header><main class="wrap"><section class="card"><div class="grid"><div><label for="l">Length (m)</label><input id="l" type="number" min="0" step="0.01" value="5"></div><div><label for="w">Width (m)</label><input id="w" type="number" min="0" step="0.01" value="4"></div><div><label for="d">Depth (m)</label><input id="d" type="number" min="0" step="0.001" value="0.1"></div></div><label style="margin-top:16px">Wastage (%)</label><input id="waste" type="number" min="0" max="50" step="0.5" value="5"><button id="calc">Calculate Concrete</button></section><section class="card" aria-live="polite"><div class="result">Estimated concrete<strong id="out">2.10 m³</strong></div><p class="note">This is a volume estimate only. Mix design, reinforcement, compaction, formwork and site conditions are not included.</p></section><a class="back" href="/construction-calculators.html">← Construction Calculators</a></main><script>const $=id=>document.getElementById(id);function calc(){const l=+$('l').value,w=+$('w').value,d=+$('d').value,x=+$('waste').value;if(l>0&&w>0&&d>0&&x>=0){$('out').textContent=(l*w*d*(1+x/100)).toFixed(2)+' m³'}else $('out').textContent='Enter valid values'}document.getElementById('calc').onclick=calc;document.querySelectorAll('input').forEach(x=>x.oninput=calc);calc();</script></body></html>
