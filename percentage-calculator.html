<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free percentage calculator. Calculate percentage of a number, percentage change and what percent one number is of another."><link rel="canonical" href="https://pennitools.in/percentage-calculator.html"><meta name="robots" content="index,follow"><title>Percentage Calculator – Percent Change & More | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:30px;border-radius:0 0 22px 22px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{background:#f3f7ff;padding:18px;border-radius:12px;margin-top:12px}.box strong{display:block;font-size:26px;color:#155eef;margin-top:4px}label{display:block;font-weight:700;margin-bottom:6px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font-size:16px}input{border:1px solid #cfd7e4}button{margin-top:16px;border:0;background:#155eef;color:#fff;font-weight:800}@media(max-width:600px){.grid{grid-template-columns:1fr}button{min-height:46px}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Percentage Calculator</h1><div>Three quick ways to calculate percentages.</div></div></header><main class="wrap"><section class="card"><h2>What is X% of Y?</h2><div class="grid"><div><label for="x">Percentage X</label><input id="x" type="number" value="20"></div><div><label for="y">Number Y</label><input id="y" type="number" value="500"></div></div><div class="box">Result<strong id="r1">100</strong></div></section><section class="card"><h2>What percentage is X of Y?</h2><div class="grid"><div><label for="a">Number X</label><input id="a" type="number" value="50"></div><div><label for="b">Number Y</label><input id="b" type="number" value="200"></div></div><div class="box">Percentage<strong id="r2">25%</strong></div></section><section class="card"><h2>Percentage change</h2><div class="grid"><div><label for="old">Original value</label><input id="old" type="number" value="100"></div><div><label for="new">New value</label><input id="new" type="number" value="125"></div></div><div class="box">Change<strong id="r3">25%</strong></div></section><a href="/finance-calculators.html" style="display:inline-block;margin-top:18px;color:#155eef;font-weight:700">← Finance Calculators</a></main><script>const $=id=>document.getElementById(id);function calc(){const x=+$('x').value,y=+$('y').value,a=+$('a').value,b=+$('b').value,o=+$('old').value,n=+$('new').value;$('r1').textContent=isFinite(x*y/100)?(x*y/100).toLocaleString('en-IN',{maximumFractionDigits:2}):'—';$('r2').textContent=b!==0?(a/b*100).toFixed(2)+'%':'—';$('r3').textContent=o!==0?((n-o)/Math.abs(o)*100).toFixed(2)+'%':'—'}document.querySelectorAll('input').forEach(x=>x.oninput=calc);calc();</script></body></html>
