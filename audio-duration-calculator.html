<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free browser audio duration calculator for local audio files."><title>Audio Duration Calculator | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:28px;border-radius:0 0 20px 20px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px}.pick{display:block;padding:14px;border:1px dashed #98a2b3;border-radius:10px}.result{margin-top:16px;padding:18px;background:#eef4ff;border-radius:12px;font-size:20px;font-weight:700}.back{display:inline-block;margin-top:18px;color:#155eef;font-weight:700}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Audio Duration Calculator</h1><div>Find the duration of an audio file directly in your browser.</div></div></header><main class="wrap"><section class="card"><label class="pick">Choose an audio file<input id="file" type="file" accept="audio/*" style="display:block;margin-top:10px"></label><div id="out" class="result" aria-live="polite">Select an audio file to see its duration.</div><p>The file is read locally by your browser and is not uploaded to PenniTools.</p></section><a class="back" href="/">← All PenniTools</a></main><script>const f=document.getElementById('file'),o=document.getElementById('out');f.onchange=()=>{const file=f.files[0];if(!file)return;const audio=document.createElement('audio');audio.preload='metadata';audio.onloadedmetadata=()=>{if(!Number.isFinite(audio.duration)||audio.duration<0){o.textContent='Unable to determine the audio duration.';return}const s=Math.round(audio.duration);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;o.textContent=`Duration: ${h?String(h).padStart(2,'0')+':':''}${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;URL.revokeObjectURL(audio.src)};audio.onerror=()=>o.textContent='Unable to read this audio format.';audio.src=URL.createObjectURL(file)};</script></body></html>
