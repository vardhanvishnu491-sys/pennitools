<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free paint calculator. Estimate wall area, paint litres and number of coats from room dimensions and coverage."><meta name="robots" content="index,follow"><link rel="canonical" href="https://pennitools.in/paint-calculator.html"><title>Paint Calculator – Estimate Paint Required for Walls | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#071633,#4f46e5);color:#fff;padding:28px;border-radius:0 0 24px 24px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cfd7e4;border-radius:10px;font-size:16px}.btn{margin-top:16px;border:0;border-radius:11px;padding:13px 18px;background:#4f46e5;color:#fff;font-weight:800}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.result{padding:18px;border-radius:14px;background:#f5f3ff}.result strong{display:block;font-size:23px;color:#4f46e5}.small{color:#667085;font-size:13px}@media(max-width:650px){.grid,.results{grid-template-columns:1fr}.wrap{padding:12px}.hero{padding:22px}}</style></head><body><div class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Paint Calculator</h1><div>Estimate wall area and paint required for your project.</div></div></div><main class="wrap"><section class="card"><div class="grid"><div class="field"><label for="length">Wall length (ft)</label><input id="length" type="number" min="0" step="0.1" value="20"></div><div class="field"><label for="height">Wall height (ft)</label><input id="height" type="number" min="0" step="0.1" value="10"></div><div class="field"><label for="walls">Number of walls</label><input id="walls" type="number" min="1" step="1" value="4"></div><div class="field"><label for="coverage">Coverage (sq ft/L)</label><input id="coverage" type="number" min="1" step="1" value="100"></div><div class="field"><label for="coats">Number of coats</label><input id="coats" type="number" min="1" step="1" value="2"></div></div><button class="btn" id="calc">Calculate Paint</button></section><section class="card" aria-live="polite"><div class="results"><div class="result"><span>Wall area</span><strong id="area">0 sq ft</strong></div><div class="result"><span>Paint required</span><strong id="litres">0 L</strong></div><div class="result"><span>Recommended purchase</span><strong id="buy">0 L</strong></div></div><p class="small">Coverage varies by paint, surface and application. Add doors/windows separately if you need a more precise estimate.</p></section></main><script>const $=id=>document.getElementById(id);function calc(){const l=+$('length').value,h=+$('height').value,w=+$('walls').value,c=+$('coverage').value,co=+$('coats').value;if(!(l>0&&h>0&&w>0&&c>0&&co>0))return;const area=l*h*w,litres=area*co/c,buy=Math.ceil(litres*2)/2;$('area').textContent=area.toFixed(1)+' sq ft';$('litres').textContent=litres.toFixed(2)+' L';$('buy').textContent=buy.toFixed(1)+' L'}$('calc').addEventListener('click',calc);document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc();</script></body></html>
