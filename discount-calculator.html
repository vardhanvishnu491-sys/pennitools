<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free discount calculator. Calculate sale price, discount amount and savings instantly."><link rel="canonical" href="https://pennitools.in/discount-calculator.html"><meta name="robots" content="index,follow"><title>Discount Calculator – Sale Price & Savings | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:30px;border-radius:0 0 22px 22px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd7e4;border-radius:10px;font-size:16px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.result{padding:15px;background:#f3f7ff;border-radius:12px}.result strong{display:block;margin-top:4px;font-size:21px;color:#155eef}@media(max-width:600px){.grid,.results{grid-template-columns:1fr}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Discount Calculator</h1><div>Find your savings and final sale price.</div></div></header><main class="wrap"><section class="card"><div class="grid"><div><label for="price">Original price (₹)</label><input id="price" type="number" min="0" step="0.01" value="2000"></div><div><label for="discount">Discount (%)</label><input id="discount" type="number" min="0" max="100" step="0.01" value="20"></div></div></section><section class="card" aria-live="polite"><div class="results"><div class="result">You save<strong id="save">₹400.00</strong></div><div class="result">Sale price<strong id="sale">₹1,600.00</strong></div><div class="result">Discount<strong id="pct">20%</strong></div></div></section><a href="/finance-calculators.html" style="display:inline-block;margin-top:18px;color:#155eef;font-weight:700">← Finance Calculators</a></main><script>const p=document.getElementById('price'),d=document.getElementById('discount'),s=document.getElementById('save'),sale=document.getElementById('sale');const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(n);function calc(){const x=+p.value,y=+d.value;if(x>=0&&y>=0&&y<=100){const z=x*y/100;s.textContent=money(z);sale.textContent=money(x-z);document.getElementById('pct').textContent=y+'%'}}p.oninput=d.oninput=calc;calc();</script></body></html>
