<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free discount calculator. Calculate sale price, discount amount and savings instantly."><link rel="canonical" href="https://pennitools.in/discount-calculator.html"><meta name="robots" content="index,follow"><title>Discount Calculator – Sale Price & Savings | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:30px;border-radius:0 0 22px 22px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd7e4;border-radius:10px;font-size:16px}input:focus-visible{outline:3px solid #98b9ff;outline-offset:2px}.error{color:#b42318;font-weight:700;min-height:22px;margin-top:10px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.result{padding:15px;background:#f3f7ff;border-radius:12px}.result strong{display:block;margin-top:4px;font-size:21px;color:#155eef}.back{display:inline-block;margin-top:18px;color:#155eef;font-weight:700}.back:focus-visible{outline:3px solid #98b9ff;outline-offset:3px}@media(max-width:600px){.grid,.results{grid-template-columns:1fr}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Discount Calculator</h1><div>Find your savings and final sale price.</div></div></header><main class="wrap"><section class="card"><div class="grid"><div><label for="price">Original price (₹)</label><input id="price" type="number" min="0" max="1000000000" step="0.01" value="2000" inputmode="decimal"></div><div><label for="discount">Discount (%)</label><input id="discount" type="number" min="0" max="100" step="0.01" value="20" inputmode="decimal"></div></div><div class="error" id="error" aria-live="polite"></div></section><section class="card" aria-live="polite"><div class="results"><div class="result">You save<strong id="save">₹400.00</strong></div><div class="result">Sale price<strong id="sale">₹1,600.00</strong></div><div class="result">Discount<strong id="pct">20%</strong></div></div></section><a class="back" href="/finance-calculators.html">← Finance Calculators</a></main><script>const p=document.getElementById('price'),d=document.getElementById('discount'),s=document.getElementById('save'),sale=document.getElementById('sale'),pct=document.getElementById('pct'),error=document.getElementById('error');const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(n);function calc(){const x=Number(p.value),y=Number(d.value);error.textContent='';if(!Number.isFinite(x)||!Number.isFinite(y)||x<0||x>1000000000||y<0||y>100){s.textContent='—';sale.textContent='—';pct.textContent='—';error.textContent='Please enter a valid price and a discount between 0% and 100%.';return}const z=x*y/100;if(!Number.isFinite(z)||!Number.isFinite(x-z)){s.textContent='—';sale.textContent='—';pct.textContent='—';error.textContent='The entered values are too large to calculate safely.';return}s.textContent=money(z);sale.textContent=money(x-z);pct.textContent=y+'%'}p.oninput=d.oninput=calc;calc();</script></body></html>
