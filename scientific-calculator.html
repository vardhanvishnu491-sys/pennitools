<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free scientific calculator for arithmetic, trigonometry, logarithms and powers."><title>Scientific Calculator | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:28px;border-radius:0 0 20px 20px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:20px;margin-top:18px}.display{width:100%;box-sizing:border-box;padding:16px;font-size:26px;text-align:right;border:1px solid #ccd5e3;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}button{padding:14px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;font-size:16px;font-weight:700;cursor:pointer}.op{background:#eef4ff}.back{display:inline-block;margin-top:18px;color:#155eef;font-weight:700}@media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr)}button{min-height:48px}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Scientific Calculator</h1><div>Arithmetic, powers, roots, logarithms and trigonometry.</div></div></header><main class="wrap"><section class="card"><input id="display" class="display" value="0" aria-label="Calculator display" readonly><div class="grid"><button onclick="clearCalc()">C</button><button onclick="del()">⌫</button><button onclick="add('(')">(</button><button onclick="add(')')">)</button><button onclick="fn('sin')">sin</button><button onclick="fn('cos')">cos</button><button onclick="fn('tan')">tan</button><button onclick="fn('sqrt')">√</button><button onclick="fn('log')">log</button><button onclick="fn('ln')">ln</button><button onclick="add('^')">xʸ</button><button onclick="add('pi')">π</button><button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button class="op" onclick="add('/')">÷</button><button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button class="op" onclick="add('*')">×</button><button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button class="op" onclick="add('-')">−</button><button onclick="add('0')">0</button><button onclick="add('.')">.</button><button onclick="add('^2')">x²</button><button class="op" onclick="add('+')">+</button><button style="grid-column:span 4" class="op" onclick="calculate()">=</button></div></section><a class="back" href="/">← All PenniTools</a></main><script>const d=document.getElementById('display');let expr='';const funcs={sin:Math.sin,cos:Math.cos,tan:Math.tan,sqrt:Math.sqrt,log:Math.log10,ln:Math.log};const constants={pi:Math.PI};function sync(){d.value=expr||'0'}function add(x){expr+=x;sync()}function clearCalc(){expr='';sync()}function del(){expr=expr.slice(0,-1);sync()}function tokenize(s){const t=[];let i=0;while(i<s.length){const c=s[i];if(/\s/.test(c)){i++;continue}if(/[0-9.]/.test(c)){const m=s.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?/i);if(!m)throw 0;t.push({type:'num',value:Number(m[0])});i+=m[0].length;continue}if(/[A-Za-z]/.test(c)){const m=s.slice(i).match(/^[A-Za-z]+/)[0].toLowerCase();t.push({type:'id',value:m});i+=m.length;continue}if('+-*/^(),'.includes(c)){t.push({type:c});i++;continue}throw 0}return t}function evaluate(s){const t=tokenize(s);let i=0;function primary(){const x=t[i];if(!x)throw 0;if(x.type==='num'){i++;return x.value}if(x.type==='+'){i++;return primary()}if(x.type==='-'){i++;return -primary()}if(x.type==='('){i++;const v=expression();if(!t[i]||t[i].type!==')')throw 0;i++;return v}if(x.type==='id'){i++;if(constants[x.value]!==undefined)return constants[x.value];if(!funcs[x.value]||!t[i]||t[i].type!=='(')throw 0;i++;const v=expression();if(!t[i]||t[i].type!==')')throw 0;i++;const r=funcs[x.value](v);if(!Number.isFinite(r))throw 0;return r}throw 0}function power(){let v=primary();if(t[i]&&t[i].type==='^'){i++;v=Math.pow(v,power())}return v}function term(){let v=power();while(t[i]&&(t[i].type==='*'||t[i].type==='/')){const op=t[i++].type,r=power();if(op==='/'&&r===0)throw 0;v=op==='*'?v*r:v/r}return v}function expression(){let v=term();while(t[i]&&(t[i].type==='+'||t[i].type==='-')){const op=t[i++].type,r=term();v=op==='+'?v+r:v-r}return v}const v=expression();if(i!==t.length||!Number.isFinite(v))throw 0;return v}function calculate(){try{if(!expr||expr.length>200)throw 0;expr=String(evaluate(expr));sync()}catch(e){d.value='Error';expr=''}}function fn(name){if(!expr)return;expr=name+'('+expr+')';calculate()}sync();</script></body></html>
