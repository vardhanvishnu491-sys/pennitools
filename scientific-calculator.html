<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free scientific calculator for arithmetic, trigonometry, logarithms and powers."><title>Scientific Calculator | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:28px;border-radius:0 0 20px 20px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:20px;margin-top:18px}.display{width:100%;box-sizing:border-box;padding:16px;font-size:26px;text-align:right;border:1px solid #ccd5e3;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}button{padding:14px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;font-size:16px;font-weight:700;cursor:pointer}.op{background:#eef4ff}.back{display:inline-block;margin-top:18px;color:#155eef;font-weight:700}@media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Scientific Calculator</h1><div>Arithmetic, powers, roots, logarithms and trigonometry.</div></div></header><main class="wrap"><section class="card"><input id="display" class="display" value="0" aria-label="Calculator display" readonly><div class="grid"><button onclick="clearCalc()">C</button><button onclick="del()">⌫</button><button onclick="add('(')">(</button><button onclick="add(')')">)</button><button onclick="fn('sin')">sin</button><button onclick="fn('cos')">cos</button><button onclick="fn('tan')">tan</button><button onclick="fn('sqrt')">√</button><button onclick="fn('log')">log</button><button onclick="fn('ln')">ln</button><button onclick="add('**')">xʸ</button><button onclick="add('Math.PI')">π</button><button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button class="op" onclick="add('/')">÷</button><button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button class="op" onclick="add('*')">×</button><button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button class="op" onclick="add('-')">−</button><button onclick="add('0')">0</button><button onclick="add('.')">.</button><button onclick="add('**2')">x²</button><button class="op" onclick="add('+')">+</button><button style="grid-column:span 4" class="op" onclick="calculate()">=</button></div></section><a class="back" href="/">← All PenniTools</a></main><script>const d=document.getElementById('display');let expr='';function sync(){d.value=expr||'0'}function add(x){expr+=x;sync()}function clearCalc(){expr='';sync()}function del(){expr=expr.slice(0,-1);sync()}function calculate(){try{if(!/^[0-9+\-*/().\sA-Za-z_]+$/.test(expr)||/(constructor|window|document|Function|eval)/.test(expr))throw 0;const v=Function('Math','return '+expr)(Math);if(!Number.isFinite(v))throw 0;expr=String(v);sync()}catch(e){d.value='Error';expr=''}}function fn(name){if(!expr)return;const map={sin:'Math.sin',cos:'Math.cos',tan:'Math.tan',sqrt:'Math.sqrt',log:'Math.log10',ln:'Math.log'};expr=map[name]+'('+expr+')';calculate()}sync();</script></body></html>
