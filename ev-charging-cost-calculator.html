<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free EV charging cost calculator. Estimate electric vehicle charging cost from battery size, charge percentage and electricity tariff."><link rel="canonical" href="https://pennitools.in/ev-charging-cost-calculator.html"><meta name="robots" content="index,follow"><title>EV Charging Cost Calculator | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:30px;border-radius:0 0 22px 22px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font-size:16px}input{border:1px solid #cfd7e4}button{margin-top:16px;border:0;background:#155eef;color:#fff;font-weight:800}.result{padding:20px;background:#f3f7ff;border-radius:12px;text-align:center}.result strong{display:block;margin-top:5px;font-size:30px;color:#155eef}.back{display:inline-block;margin-top:18px;color:#155eef;font-weight:700;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:1fr}button{min-height:46px}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>EV Charging Cost Calculator</h1><div>Estimate the electricity cost for an EV charge.</div></div></header><main class="wrap"><section class="card"><div class="grid"><div><label for="battery">Battery capacity (kWh)</label><input id="battery" type="number" min="0" step="0.1" value="40"></div><div><label for="start">Starting charge (%)</label><input id="start" type="number" min="0" max="100" step="1" value="20"></div><div><label for="end">Target charge (%)</label><input id="end" type="number" min="0" max="100" step="1" value="80"></div><div><label for="tariff">Electricity tariff (₹/kWh)</label><input id="tariff" type="number" min="0" step="0.01" value="8"></div></div><button id="calc">Calculate Charging Cost</button></section><section class="card" aria-live="polite"><div class="result">Estimated energy<strong id="energy">24.00 kWh</strong></div><div class="result" style="margin-top:10px">Estimated cost<strong id="cost">₹192.00</strong></div><p>Real charging losses can make the electricity drawn from the grid higher than the battery energy stored.</p></section><a class="back" href="/vehicle-calculators.html">← Vehicle Calculators</a></main><script>const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(n);function calc(){const b=+$('battery').value,s=+$('start').value,e=+$('end').value,t=+$('tariff').value;if(b>0&&s>=0&&e>s&&e<=100&&t>=0){const k=b*(e-s)/100;$('energy').textContent=k.toFixed(2)+' kWh';$('cost').textContent=money(k*t)}else{$('energy').textContent='Enter valid values';$('cost').textContent='—'}}$('calc').onclick=calc;document.querySelectorAll('input').forEach(x=>x.oninput=calc);calc();</script></body></html>
