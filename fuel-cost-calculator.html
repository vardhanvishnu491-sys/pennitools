<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free fuel cost calculator for India. Estimate fuel required and trip cost from distance, mileage and fuel price."><link rel="canonical" href="https://pennitools.in/fuel-cost-calculator.html"><meta name="robots" content="index,follow"><title>Fuel Cost Calculator India – Petrol & Diesel | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:30px;border-radius:0 0 22px 22px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font-size:16px}input{border:1px solid #cfd7e4}input:focus,button:focus,.back:focus{outline:3px solid #93c5fd;outline-offset:2px}button{margin-top:16px;border:0;background:#155eef;color:#fff;font-weight:800;cursor:pointer}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.result{padding:15px;background:#f3f7ff;border-radius:12px}.result strong{display:block;margin-top:4px;font-size:21px;color:#155eef}.error{color:#b42318;font-weight:700;min-height:20px;margin-top:10px}.back{display:inline-block;margin-top:18px;color:#155eef;font-weight:700;text-decoration:none}@media(max-width:600px){.grid,.results{grid-template-columns:1fr}button{min-height:46px}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Fuel Cost Calculator</h1><div>Estimate fuel needed and trip cost in seconds.</div></div></header><main class="wrap"><section class="card"><div class="grid"><div><label for="distance">Distance (km)</label><input id="distance" type="number" min="0" step="0.1" value="300"></div><div><label for="mileage">Mileage (km/l)</label><input id="mileage" type="number" min="0" step="0.1" value="15"></div><div><label for="price">Fuel price (₹/litre)</label><input id="price" type="number" min="0" step="0.01" value="100"></div></div><div class="error" id="error" aria-live="polite"></div><button id="calc" type="button">Calculate Fuel Cost</button></section><section class="card" aria-live="polite"><div class="results"><div class="result">Fuel needed<strong id="litres">20.00 L</strong></div><div class="result">Fuel cost<strong id="cost">₹2,000.00</strong></div><div class="result">Cost/km<strong id="km">₹6.67</strong></div></div></section><a class="back" href="/vehicle-calculators.html">← Vehicle Calculators</a></main><script>const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(n);function calc(){const d=Number($('distance').value),m=Number($('mileage').value),p=Number($('price').value),error=$('error');error.textContent='';if(!Number.isFinite(d)||!Number.isFinite(m)||!Number.isFinite(p)||!(d>0)||!(m>0)||p<0||d>10000000||m>1000||p>100000){$('litres').textContent='—';$('cost').textContent='—';$('km').textContent='—';error.textContent='Please enter valid fuel calculation values.';return}const l=d/m,c=l*p;if(!Number.isFinite(l)||!Number.isFinite(c)){$('litres').textContent='—';$('cost').textContent='—';$('km').textContent='—';error.textContent='The entered values are too large to calculate safely.';return}$('litres').textContent=l.toFixed(2)+' L';$('cost').textContent=money(c);$('km').textContent=money(c/d)}$('calc').addEventListener('click',calc);document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc();</script></body></html>
