<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free EV range calculator. Estimate electric vehicle driving range from battery capacity and energy efficiency."><link rel="canonical" href="https://pennitools.in/ev-range-calculator.html"><meta name="robots" content="index,follow"><title>EV Range Calculator – Estimate Electric Car Range | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:30px;border-radius:0 0 22px 22px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font-size:16px}input{border:1px solid #cfd7e4}input:focus,button:focus{outline:3px solid #93c5fd;outline-offset:2px}button{margin-top:16px;border:0;background:#155eef;color:#fff;font-weight:800;cursor:pointer}.result{padding:20px;background:#f3f7ff;border-radius:12px;text-align:center}.result strong{display:block;margin-top:5px;font-size:30px;color:#155eef}.back{display:inline-block;margin-top:18px;color:#155eef;font-weight:700;text-decoration:none}.back:focus{outline:3px solid #93c5fd;outline-offset:2px}@media(max-width:600px){.grid{grid-template-columns:1fr}button{min-height:46px}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>EV Range Calculator</h1><div>Estimate range from battery capacity and efficiency.</div></div></header><main class="wrap"><section class="card"><div class="grid"><div><label for="battery">Battery capacity (kWh)</label><input id="battery" type="number" min="0" step="0.1" value="40"></div><div><label for="eff">Efficiency (km/kWh)</label><input id="eff" type="number" min="0" step="0.1" value="6"></div></div><button id="calc" type="button">Calculate EV Range</button></section><section class="card" aria-live="polite"><div class="result">Estimated range<strong id="out">240 km</strong></div><p>This is a simple estimate. Actual range varies with speed, traffic, temperature, load, terrain and driving style.</p></section><a class="back" href="/vehicle-calculators.html">← Vehicle Calculators</a></main><script>const b=document.getElementById('battery'),e=document.getElementById('eff'),o=document.getElementById('out');function calc(){const x=Number(b.value),y=Number(e.value);o.textContent=Number.isFinite(x)&&Number.isFinite(y)&&x>0&&y>0&&x*y<=100000?'Estimated range: '+Math.round(x*y)+' km':'Enter valid values'}document.getElementById('calc').addEventListener('click',calc);b.addEventListener('input',calc);e.addEventListener('input',calc);calc();</script></body></html>
