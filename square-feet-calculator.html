<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free square feet calculator for carpenters and construction workers. Calculate square feet from inches or feet quickly."><meta name="robots" content="index,follow"><link rel="canonical" href="https://pennitools.in/square-feet-calculator.html"><title>Square Feet Calculator – Inches to Sq Ft | PenniTools</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.55 Arial,sans-serif;background:#f5f7fb;color:#222}header{background:#155eef;color:#fff;padding:22px 16px;text-align:center}header h1{margin:0;font-size:28px}.container{max-width:600px;margin:25px auto;padding:0 16px}.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 18px #00000014}label{display:block;font-weight:700;margin:15px 0 7px}input,select,button{width:100%;padding:14px;border-radius:10px;font-size:17px}input,select{border:1px solid #ccc}button{margin-top:22px;border:0;background:#155eef;color:#fff;font-weight:700;cursor:pointer;min-height:48px}.result{margin-top:22px;padding:18px;background:#eef5ff;border-radius:12px;text-align:center}.result strong{display:block;font-size:28px;color:#155eef;margin:8px 0}.formula{margin-top:25px;padding:18px;background:#f8f8f8;border-radius:12px;line-height:1.7}.back{display:inline-block;margin-top:20px;color:#155eef;text-decoration:none;font-weight:700}:focus-visible{outline:3px solid #155eef;outline-offset:2px}@media(max-width:650px){.container{margin:12px auto;padding:0 12px}.card{padding:18px}input,select{font-size:16px}}</style></head><body><header><h1>Square Feet Calculator</h1><p>Carpenter & Construction Calculator</p></header><main class="container"><div class="card"><label for="length">Length</label><input id="length" type="number" min="0" step="any" placeholder="Example: 77"><label for="width">Width</label><input id="width" type="number" min="0" step="any" placeholder="Example: 33"><label for="unit">Measurement Unit</label><select id="unit"><option value="inches">Inches</option><option value="feet">Feet</option></select><button id="calc">Calculate Square Feet</button><div class="result" id="result" aria-live="polite" hidden>Area<strong id="answer"></strong><div id="calculation"></div></div><div class="formula"><h2>How to calculate square feet</h2><p><strong>Inches:</strong> Length × Width ÷ 144 = Square Feet</p><p><strong>Feet:</strong> Length × Width = Square Feet</p></div><a class="back" href="index.html">← Back to PenniTools</a></div></main><footer style="text-align:center;padding:30px 15px;color:#666;font-size:14px">© 2026 PenniTools.in — Free calculators for India</footer><script>const $=id=>document.getElementById(id);function calculateArea(){const l=Number($("length").value),w=Number($("width").value),u=$("unit").value;if(!(l>0&&w>0)){alert("Please enter valid length and width.");return}const area=u==='inches'?l*w/144:l*w;$("answer").textContent=area.toFixed(2)+' sq ft';$("calculation").textContent=u==='inches'?`${l} × ${w} ÷ 144 = ${area.toFixed(2)} sq ft`:`${l} × ${w} = ${area.toFixed(2)} sq ft`;$("result").hidden=false}$("calc").addEventListener('click',calculateArea);["length","width","unit"].forEach(id=>$(id).addEventListener('change',()=>{if($("length").value&&$("width").value)calculateArea()}));</script></body></html>
