<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Extra construction calculators for bricks, plaster, steel, sand and cement."><title>Construction Material Calculators | PenniTools</title><style>:root{--b:#2563eb;--bg:#f6f8fc;--ink:#101828}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial}.wrap{width:min(850px,calc(100% - 24px));margin:auto}header{padding:30px 0;background:linear-gradient(135deg,#071633,#2563eb);color:#fff}h1{margin:0;font-size:clamp(30px,7vw,48px)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs a{background:#fff;border:1px solid #dbe3ef;border-radius:999px;padding:8px 12px;text-decoration:none;color:#174ea6;font-weight:700}.card{display:none;background:#fff;border:1px solid #e0e7f0;border-radius:18px;padding:22px;box-shadow:0 8px 25px #0f172a12}.card.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field input{padding:12px;border:1px solid #ccd5e3;border-radius:10px;font-size:16px}.btn{border:0;background:var(--b);color:#fff;padding:12px 17px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}.out{margin-top:16px;padding:14px;border-radius:12px;background:#eef4ff}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><h1>Construction Material Calculators</h1><p>Quick estimates for common building materials.</p></div></header><main class="wrap"><nav class="tabs"><a href="#brick">Brick / Block</a><a href="#plaster">Plaster</a><a href="#steel">Steel Weight</a><a href="#sandcement">Sand & Cement</a></nav><section id="brick" class="card"><h2>Brick / Block Calculator</h2><div class="grid"><div class="field"><label>Wall length (ft)</label><input id="bl" type="number" value="20"></div><div class="field"><label>Wall height (ft)</label><input id="bh" type="number" value="10"></div><div class="field"><label>Brick length (in)</label><input id="briL" type="number" value="9"></div><div class="field"><label>Brick height (in)</label><input id="briH" type="number" value="3"></div></div><button class="btn" onclick="brick()">Calculate</button><div id="bo" class="out"></div></section><section id="plaster" class="card"><h2>Plaster Calculator</h2><div class="grid"><div class="field"><label>Wall length (ft)</label><input id="pl" type="number" value="20"></div><div class="field"><label>Wall height (ft)</label><input id="ph" type="number" value="10"></div><div class="field"><label>Plaster thickness (mm)</label><input id="pt" type="number" value="12"></div><div class="field"><label>Wastage %</label><input id="pw" type="number" value="5"></div></div><button class="btn" onclick="plaster()">Calculate</button><div id="po" class="out"></div></section><section id="steel" class="card"><h2>Steel Weight Calculator</h2><div class="grid"><div class="field"><label>Bar diameter (mm)</label><input id="sd" type="number" value="12"></div><div class="field"><label>Total length (m)</label><input id="sl" type="number" value="100"></div></div><button class="btn" onclick="steel()">Calculate</button><div id="so" class="out"></div></section><section id="sandcement" class="card"><h2>Sand & Cement Calculator</h2><div class="grid"><div class="field"><label>Dry volume (m³)</label><input id="sv" type="number" value="1"></div><div class="field"><label>Cement parts</label><input id="sc" type="number" value="1"></div><div class="field"><label>Sand parts</label><input id="ss" type="number" value="6"></div></div><button class="btn" onclick="sand()">Calculate</button><div id="sao" class="out"></div></section><p><a href="/">← Back to PenniTools</a></p></main><script>function q(id){return Number(document.getElementById(id).value)||0}function brick(){let a=q('bl')*q('bh'),p=(q('briL')/12)*(q('briH')/12);document.getElementById('bo').innerHTML=`Wall area: <b>${a.toFixed(2)} sq ft</b><br>Approx. bricks: <b>${p?Math.ceil(a/p):0}</b>`}function plaster(){let a=q('pl')*q('ph'),v=a*q('pt')/1000*0.3048, x=v*(1+q('pw')/100);document.getElementById('po').innerHTML=`Plaster area: <b>${a.toFixed(2)} sq ft</b><br>Wet volume: <b>${v.toFixed(3)} m³</b><br>With wastage: <b>${x.toFixed(3)} m³</b>`}function steel(){let w=q('sd')*q('sd')/162*q('sl');document.getElementById('so').innerHTML=`Estimated steel weight: <b>${w.toFixed(2)} kg</b>`}function sand(){let v=q('sv'),c=q('sc'),s=q('ss'),total=c+s;document.getElementById('sao').innerHTML=`Cement volume: <b>${(v*c/total).toFixed(3)} m³</b><br>Sand volume: <b>${(v*s/total).toFixed(3)} m³</b>`}function show(){let id=location.hash.slice(1)||'brick';document.querySelectorAll('.card').forEach(x=>x.classList.remove('active'));document.getElementById(id)?.classList.add('active')}addEventListener('hashchange',show);show();</script></body></html>
