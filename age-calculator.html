<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free age calculator. Calculate your exact age in years, months and days from your date of birth."><link rel="canonical" href="https://pennitools.in/age-calculator.html"><meta name="robots" content="index,follow"><title>Age Calculator – Exact Age in Years, Months & Days | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#071633,#2563eb);color:#fff;padding:30px;border-radius:0 0 22px 22px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}label{display:block;font-weight:700;margin-bottom:6px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font-size:16px}input{border:1px solid #cfd7e4}button{margin-top:16px;border:0;background:#155eef;color:#fff;font-weight:800;cursor:pointer}button:focus-visible,input:focus-visible,.back:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}.result{margin-top:18px;padding:20px;background:#f3f7ff;border-radius:12px;text-align:center}.result strong{display:block;font-size:28px;color:#155eef;margin-top:6px}.back{display:inline-block;margin-top:18px;color:#155eef;font-weight:700;text-decoration:none}@media(max-width:600px){button{min-height:46px}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Age Calculator</h1><div>Calculate exact age from date of birth.</div></div></header><main class="wrap"><section class="card"><label for="dob">Date of birth</label><input id="dob" type="date"><button id="calc" type="button">Calculate Age</button></section><section class="card" aria-live="polite"><div class="result">Your age<strong id="out">Select your date of birth</strong></div></section><a class="back" href="/">← All PenniTools</a></main><script>const dob=document.getElementById('dob'),out=document.getElementById('out');const pad=n=>String(n).padStart(2,'0');const now=new Date();dob.max=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());function calc(){if(!dob.value){out.textContent='Select your date of birth';return}const d=new Date(dob.value+'T00:00:00'),t=new Date();if(d>t){out.textContent='Enter a valid past date';return}let y=t.getFullYear()-d.getFullYear(),m=t.getMonth()-d.getMonth(),day=t.getDate()-d.getDate();if(day<0){m--;day+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}if(m<0){y--;m+=12}out.textContent=y+' years, '+m+' months, '+day+' days'}document.getElementById('calc').onclick=calc;dob.onchange=calc;</script></body></html>
