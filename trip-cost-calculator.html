<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free trip cost calculator. Calculate fuel cost, total trip expense and cost per kilometre using distance, mileage and fuel price."><meta name="robots" content="index,follow"><link rel="canonical" href="https://pennitools.in/trip-cost-calculator.html"><title>Trip Cost Calculator – Fuel Cost & Cost Per KM | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#071633,#06b6d4);color:#fff;padding:28px;border-radius:0 0 24px 24px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cfd7e4;border-radius:10px;font-size:16px}.btn{margin-top:16px;border:0;border-radius:11px;padding:13px 18px;background:#155eef;color:#fff;font-weight:800}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.result{padding:18px;border-radius:14px;background:#f3f7ff}.result strong{display:block;font-size:23px;color:#155eef}.small{color:#667085;font-size:13px}@media(max-width:650px){.grid,.results{grid-template-columns:1fr}.wrap{padding:12px}.hero{padding:22px}}</style></head><body><div class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Trip Cost Calculator</h1><div>Estimate fuel needed, total fuel cost and cost per kilometre.</div></div></div><main class="wrap"><section class="card"><div class="grid"><div class="field"><label for="distance">Distance (km)</label><input id="distance" type="number" min="0" step="1" value="100"></div><div class="field"><label for="mileage">Mileage (km/L)</label><input id="mileage" type="number" min="0.1" step="0.1" value="15"></div><div class="field"><label for="price">Fuel price (₹/L)</label><input id="price" type="number" min="0" step="0.01" value="105"></div></div><button class="btn" id="calc">Calculate Trip Cost</button></section><section class="card" aria-live="polite"><div class="results"><div class="result"><span>Fuel needed</span><strong id="fuel">0 L</strong></div><div class="result"><span>Total fuel cost</span><strong id="cost">₹0</strong></div><div class="result"><span>Cost per km</span><strong id="km">₹0</strong></div></div><p class="small">For a round trip, enter the total distance for both directions.</p></section></main><script>const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(n);function calc(){const d=+$('distance').value,m=+$('mileage').value,p=+$('price').value;if(!(d>=0&&m>0&&p>=0))return;const fuel=d/m,cost=fuel*p;$('fuel').textContent=fuel.toFixed(2)+' L';$('cost').textContent=money(cost);$('km').textContent=money(d?cost/d:0)}$('calc').addEventListener('click',calc);document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc();</script></body></html>
