<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free trip cost calculator for India. Calculate fuel needed, fuel cost, tolls, total trip cost and cost per person or kilometre."><meta name="robots" content="index,follow"><link rel="canonical" href="https://pennitools.in/trip-cost-calculator.html"><meta property="og:title" content="Trip Cost Calculator – Fuel, Toll & Cost Per KM | PenniTools"><meta property="og:description" content="Estimate fuel, tolls and total travel cost quickly. Works on mobile and updates instantly."><title>Trip Cost Calculator – Fuel, Toll & Cost Per KM | PenniTools</title><style>body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.55 Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#071633,#06b6d4);color:#fff;padding:28px;border-radius:0 0 24px 24px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #10182812}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cfd7e4;border-radius:10px;font-size:16px}.check{display:flex;align-items:center;gap:8px;margin-top:14px}.check input{width:20px;height:20px}.btn{margin-top:16px;border:0;border-radius:11px;padding:13px 18px;background:#155eef;color:#fff;font-weight:800;cursor:pointer}.results{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.result{padding:18px;border-radius:14px;background:#f3f7ff}.result strong{display:block;font-size:21px;color:#155eef;margin-top:3px}.small{color:#667085;font-size:13px}.error{color:#b42318;font-weight:700;min-height:20px}@media(max-width:760px){.grid,.results{grid-template-columns:1fr 1fr}}@media(max-width:500px){.wrap{padding:12px}.hero{padding:22px}.grid,.results{grid-template-columns:1fr}.card{padding:18px}.btn{width:100%;min-height:46px}}</style></head><body><header class="hero"><div class="wrap"><strong>PenniTools</strong><h1>Trip Cost Calculator</h1><div>Estimate fuel, tolls, total trip expense and cost per person.</div></div></header><main class="wrap"><section class="card"><div class="grid"><div class="field"><label for="distance">Distance (km)</label><input id="distance" type="number" min="0" step="1" value="300"></div><div class="field"><label for="mileage">Mileage (km/L)</label><input id="mileage" type="number" min="0.1" step="0.1" value="15"></div><div class="field"><label for="price">Fuel price (₹/L)</label><input id="price" type="number" min="0" step="0.01" value="105"></div><div class="field"><label for="toll">Tolls (₹)</label><input id="toll" type="number" min="0" step="1" value="0"></div><div class="field"><label for="people">People</label><input id="people" type="number" min="1" step="1" value="1"></div></div><label class="check"><input id="round" type="checkbox"> Round trip (double the distance)</label><div class="error" id="error" aria-live="polite"></div><button class="btn" id="calc">Calculate Trip Cost</button></section><section class="card" aria-live="polite"><div class="results"><div class="result"><span>Total distance</span><strong id="dist">0 km</strong></div><div class="result"><span>Fuel needed</span><strong id="fuel">0 L</strong></div><div class="result"><span>Total trip cost</span><strong id="cost">₹0</strong></div><div class="result"><span>Cost/person</span><strong id="person">₹0</strong></div></div><p class="small">For an accurate round trip, tick the round-trip option instead of entering the return distance again.</p></section></main><script>const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(n);function calc(){const d=+$('distance').value,m=+$('mileage').value,p=+$('price').value,t=+$('toll').value,people=Math.floor(+$('people').value),round=$('round').checked;$('error').textContent='';if(!(d>0&&m>0&&p>=0&&t>=0&&people>0)){['dist','fuel','cost','person'].forEach(id=>$(id).textContent='—');$('error').textContent='Please enter valid positive distance, mileage and people values.';return}const totalD=round?d*2:d,fuel=totalD/m,cost=fuel*p+t;$('dist').textContent=totalD.toFixed(0)+' km';$('fuel').textContent=fuel.toFixed(2)+' L';$('cost').textContent=money(cost);$('person').textContent=money(cost/people)}$('calc').addEventListener('click',calc);document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc();</script></body></html>
